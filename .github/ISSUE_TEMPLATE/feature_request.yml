name: Feature request
description: Suggest something Hub Steward should do
labels: [enhancement]
body:
  - type: textarea
    id: who
    attributes:
      label: Who needs it, and what are they trying to do
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like to see
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
