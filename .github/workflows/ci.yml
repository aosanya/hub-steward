name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  wakala-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: code/wakala-api/go.mod
      - run: go vet ./...
        working-directory: code/wakala-api
      - run: go test ./...
        working-directory: code/wakala-api
      - run: go build ./...
        working-directory: code/wakala-api

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/console/package-lock.json
      - run: npm ci
        working-directory: code/console
      - run: npm test
        working-directory: code/console
      - run: npm run build
        working-directory: code/console

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/app/package-lock.json
      - run: npm ci
        working-directory: code/app
      - run: npm test
        working-directory: code/app
      - run: npm run build
        working-directory: code/app
