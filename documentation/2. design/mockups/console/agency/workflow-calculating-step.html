 from an earlier step</option><option selected>Field of a record</option><option>The member's ledger balance</option><option>Fixed value</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></label><span class="cell-sub">Loan terms › “Months” is now worded “How many months?”. Choose the question again.</span></div></td><td><span class="tag warn">Question reworded</span></td></tr></tbody></table></div></section><section class="card"><div class="card-head"><h3>This step</h3></div><div class="settings"><div class="setting"><div class="setting-label">Who runs it</div><div class="setting-control stack" style="--stack-gap:8px;align-items:stretch"><div class="opts"><span class="opt"><span class="opt-dot"></span>The agency runs it</span><span class="opt on"><span class="opt-dot"></span>A role confirms the figure first</span></div><label class="control ctl"><span class="sr">Confirming role</span><select><option selected>Loan officer</option><option>Group treasurer</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></label><div class="hint"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 11v6"/><path d="M12 7h.01"/></svg>The role must exist in the draft. It sees the figure and can accept it or send it back.</div></div></div><div class="setting"><div class="setting-label">If it cannot work out a result<span class="req" aria-hidden="true">*</span></div><div class="setting-control stack" style="--stack-gap:8px;align-items:stretch"><div class="opts"><span class="opt"><span class="opt-dot"></span>Go to a step</span><span class="opt"><span class="opt-dot"></span>Stop and tell the person what is wrong</span></div><div class="hint field-error"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5"/><path d="M12 18h.01"/></svg>Choose what happens when this step cannot work out a result. The agency cannot be published until every calculating step has a choice.</div></div></div><div class="setting"><div class="setting-label">Result is kept as<span class="req" aria-hidden="true">*</span></div><div class="setting-control stack" style="--stack-gap:8px;align-items:stretch"><label class="control ctl"><span class="sr">Result name</span><input type="text" value="Monthly payment"></label><div class="hint"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 11v6"/><path d="M12 7h.01"/></svg>The posting step and later steps find the result under this name.</div></div></div><div class="setting"><div class="setting-label">Rounding</div><div class="setting-control stack" style="--stack-gap:8px;align-items:stretch"><div class="opts"><span class="opt"><span class="opt-dot"></span>Down</span><span class="opt"><span class="opt-dot"></span>Up</span><span class="opt on"><span class="opt-dot"></span>Half up (default)</span><span class="opt"><span class="opt-dot"></span>Half down</span><span class="opt"><span class="opt-dot"></span>Half even</span></div><div class="hint"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 11v6"/><path d="M12 7h.01"/></svg>Applied to the result. Half up is used when none is chosen.</div></div></div></
