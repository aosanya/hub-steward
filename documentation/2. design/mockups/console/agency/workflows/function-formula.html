.cond-row{display:grid;grid-template-columns:3.5rem 1fr;gap:10px;align-items:start}
.kw{padding-top:10px;font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}

.blk.v{flex-direction:column;align-items:flex-start;gap:8px}
.kids{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding-left:.5rem;border-left:1px solid var(--line2)}
.blk-label{font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.blk-type{font-size:.6875rem;color:var(--text3)}
