<figcaption class="cap">Landing, Generated: the workflows the platform makes from the records, six rows for two records. Each row names the workflow and its code, the record, the action and the role that holds it, marked Read-only, with Open and no Actions menu. Held by lists every role whose permission list carries the codes of the step (D75): add.* or an add code for every required field, edit, delete; a record names no role, and two roles that carry the codes are both listed, comma separated. Delete a project is held by the Programme lead. Add a project shows Replaced by Register a project, a designed workflow that stands in for it.<span class="cap-mcp">Filled by: agency_list_workflows, agency_list_records, agency_list_roles, agency_list_work_items</span><span class="cap-note">Proposed: the Generated sub-menu under Workflows, the table and its columns, the Held by column and the Replaced state; the console lists every workflow as one card each on one page (<a class="link sm" href="workflows.html">workflows.html</a>) and has no sub-menus here. Decided (D75): the holders are the roles that carry the codes. Example data: records, roles and workflows are drawn for this page; the lab does not buy through tenders. The Add button follows the console.</span></figcaption>
