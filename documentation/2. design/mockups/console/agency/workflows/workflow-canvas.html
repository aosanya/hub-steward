.ll.warn{fill:var(--accent)}

.pt.bad{fill:var(--bad)}
.pt.warn{fill:var(--accent)}

<figure id="s1">
<figcaption class="cap">Landing: the Loan payment workflow on the canvas. A step that gets a person's answer, a calculating step that works out every member's payment and is confirmed by the Treasurer, a calculating step run by the agency, and a posting step for each result with the ledger account it writes to. Links carry the name of each input and each result; the dashed line is where a failure goes.<span class="cap-mcp">Filled by: agency_get_workflow, agency_list_work_items, agency_list_records, agency_list_roles</span><span class="cap-note">Proposed: the console has no canvas; its Workflows page is a list of cards and a workflow opens to a detail page of step cards (<a class="link sm" href="workflows.html">workflows.html</a>). Example data: names, figures and steps are drawn for this page. The calculating step node opens the calculating step page. Proposed: the calculating and posting steps as steps on the canvas, the states they show and the stacked card that marks a step acting on a list.</span></figcaption>
