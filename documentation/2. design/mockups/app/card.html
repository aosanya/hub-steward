<style>
:root{font-size:112.5%;--content:.9rem;--r-sm:.5rem;--r-md:.875rem;--r-pill:999px;--sans:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;--bg:#EDF0EC;--bg-alt:#E3E8E3;--surface:#FBFCFA;--ink:#1B2430;--ink-soft:#3D4652;--line:rgba(27,36,48,.16);--line-strong:rgba(27,36,48,.4);--accent:#703C0F;--accent-strong:#542E0B;--accent-wash:rgba(112,60,15,.1);--on-accent:#FFFCF9;--danger:#A8402E;--success:#3F7D45;--info:#35618F;--info-wash:rgba(53,97,143,.1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-alt);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.5}

.code{font-family:var(--mono);font-size:.75rem;color:var(--ink-soft);overflow-wrap:anywhere}
.screens{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(24rem,100%),24rem));justify-content:center;gap:2.5rem 2rem;padding:2rem 1rem 3rem}

.phone{font-size:.8125rem;position:relative;display:flex;flex-direction:column;flex:none;width:24rem;max-width:100%;min-height:40rem;overflow:hidden;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 .5rem 1.5rem var(--line)}
.bar{position:sticky;top:0;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:.5rem;min-height:3rem;padding:0 .5rem;background:var(--surface);border-bottom:1px solid var(--line)}

.body{flex:1;display:flex;flex-direction:column;gap:.75rem;padding:1rem}
.head{display:flex;flex-direction:column;gap:.25rem;padding:.25rem 0}

.dot{flex:none;width:.625rem;height:.625rem;border-radius:var(--r-pill);background:var(--accent)}

.row .end.col{display:flex;flex-direction:column;align-items:flex-end;gap:.25rem}
.row .ubadge{min-width:1.25rem;height:1.25rem;padding:0 .375rem;border-radius:var(--r-pill);background:var(--danger);color:var(--on-accent);font-size:.6875rem;font-weight:600;line-height:1.25rem;text-align:center}
.tg{border:0;cursor:pointer;font:inherit;font-size:.8125rem;font-weight:500;min-height:1.75rem}
.tg[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg{display:flex;gap:.25rem;padding:.25rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill)}
.seg>a{flex:1;display:flex;align-items:center;justify-content:center;min-height:2.5rem;border-radius:var(--r-pill);color:var(--ink-soft);font-weight:500;text-align:center}
.seg>a[aria-pressed="true"]{background:var(--accent-wash);color:var(--accent-strong);font-weight:600}
.seg .dot{display:inline-block;width:.5rem;height:.5rem;margin-left:.375rem;border-radius:50%;background:var(--accent)}
.sel{flex:1;font:inherit;color:inherit}
.count{margin:0;padding:.5rem 1rem;color:var(--ink-soft);font-size:.8125rem}
.backlog{display:flex;flex-direction:column;gap:.75rem}
.fbar{position:sticky;top:3rem;z-index:1;display:flex;flex-direction:column;gap:.5rem;padding:.5rem 0;background:var(--bg)}
.icb{display:grid;place-items:center;flex:none;width:2.5rem;height:2.5rem;padding:0;border:0;background:transparent;color:var(--ink-soft)}
.icb[disabled]{opacity:.35}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn:disabled{background:var(--bg-alt);border-color:transparent;color:var(--ink-soft)}
.refusal{display:flex;gap:.625rem;padding:.75rem 1rem;border:1px solid var(--danger);border-radius:var(--r-md);color:var(--danger)}
.refusal p{color:var(--ink)}
.flabel{font-size:.8125rem;font-weight:500;color:var(--ink-soft)}
.fields{display:flex;flex-direction:column;gap:1rem}
.none{display:none;color:var(--ink-soft)}
.board{display:flex;gap:.75rem;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -1rem;padding:0 1rem .5rem}
.col{flex:none;width:15rem;scroll-snap-align:start;display:flex;flex-direction:column;gap:.5rem;padding:.5rem;background:var(--bg-alt);border:1px solid var(--line);border-radius:var(--r-md)}
.col h3{display:flex;justify-content:space-between;padding:.25rem .5rem;font-size:.875rem;font-weight:600;color:var(--ink-soft)}
.kcard{display:flex;flex-direction:column;gap:.375rem;padding:.75rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 1px 2px var(--line)}
.kcard[hidden]{display:none}
.kcard .ttl{overflow-wrap:anywhere}
.kcard .meta{display:flex;flex-wrap:wrap;gap:.375rem}
.cnone{display:none;padding:.5rem;color:var(--ink-soft);font-size:.8125rem}
.itl{font-size:var(--content);font-weight:400;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.icode{color:var(--accent);font-weight:500}
.srch{display:flex;align-items:center;gap:.5rem;min-height:3rem;padding:0 .875rem;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-md);color:var(--ink-soft)}
.dh{font-size:1.25rem;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.dbody{font-size:var(--content);padding:1rem;border-top:1px solid var(--line)}
.card.flush{padding:0;gap:0}
.card.flush>.card-head{padding:1rem}
.card.flush>.row:first-child{border-top:0}
.card.flush .rows{border:0;border-radius:0;box-shadow:none;background:transparent;border-top:1px solid var(--line)}
.qd{font-size:.8125rem;color:var(--ink-soft)}.dots{display:inline-flex;gap:.25rem}.dots i{width:.375rem;height:.375rem;border-radius:50%;background:var(--ink-soft);opacity:.6}.working{display:flex;align-items:center;gap:.5rem;color:var(--ink-soft)}.msg.mine .who b{font-weight:400;color:var(--ink-soft)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;font-weight:600}
.card-chevron{color:var(--ink-soft);font-size:1.125rem;line-height:1}
.dbody code{font-size:.9em}
.rank{flex:none;min-width:1.75rem;font-weight:600;color:var(--ink-soft)}
.heading{padding-top:.25rem;font-size:.8125rem;font-weight:600;color:var(--ink-soft)}
.chosen{display:flex;flex-wrap:wrap;gap:.5rem}
.sg{display:inline-flex;align-items:center;gap:.25rem;min-height:2.5rem;padding:0 .875rem;border:1px solid var(--line-strong);border-radius:var(--r-pill);background:var(--surface);color:var(--accent);font-weight:500;cursor:pointer}
.cbtn{display:flex;align-items:center;gap:.75rem;width:100%;min-height:3.5rem;padding:.5rem .75rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 1px 2px var(--line);color:var(--ink);font-weight:600}
.cbtn span:first-child{flex:1;min-width:0}
.progress{display:flex;flex-direction:column;gap:.5rem;font-size:.8125rem;color:var(--ink-soft)}
.pbar{height:.25rem;border-radius:var(--r-pill);background:var(--line)}
.pbar i{display:block;height:100%;border-radius:var(--r-pill);background:var(--accent)}
.field{display:flex;flex-direction:column;gap:.375rem}
.input{display:flex;align-items:center;min-height:3rem;padding:0 .875rem;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-md)}
.thread{display:flex;flex-direction:column;gap:.25rem;margin-top:auto}
.msg{display:flex;flex-direction:column;align-items:flex-start;gap:.125rem;max-width:85%}
.msg.mine{align-self:flex-end;align-items:flex-end}
.who{display:flex;align-items:center;gap:.5rem;margin-top:.5rem;font-size:.8125rem;color:var(--ink-soft)}
.who b{font-weight:600;color:var(--ink)}
.bubble{padding:.625rem .875rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow-wrap:anywhere}
.mine .bubble{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.attached{align-self:flex-start;width:92%;display:flex;flex-direction:column;gap:.75rem;margin-top:.25rem;padding:1rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 1px 2px var(--line)}
.attached .ttl{font-weight:600}
.composer{display:flex;align-items:center;gap:.5rem;padding:.75rem 1rem 1rem;background:var(--surface);border-top:1px solid var(--line)}
.cfield{flex:1;min-width:0;display:flex;align-items:center;min-height:3rem;padding:0 1rem;background:var(--bg);border:1px solid var(--line-strong);border-radius:var(--r-pill)}
.cfield input{flex:1;min-width:0;padding:0;border:0;outline:0;background:transparent}
.send{flex:none;display:grid;place-items:center;width:3rem;height:3rem;padding:0;border:0;border-radius:var(--r-pill);background:var(--bg-alt);color:var(--ink-soft)}
.jnav{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:.25rem .5rem;padding:.25rem 1rem;background:var(--surface);border-bottom:1px solid var(--line);font-size:.8125rem}
.jnav a{display:inline-flex;align-items:center;gap:.375rem;min-height:2.25rem;padding:0 .75rem;border-radius:var(--r-pill);color:var(--ink-soft)}
.jnav a[aria-current]{background:var(--accent-wash);color:var(--accent-strong);font-weight:600}
.jnav .sep{flex:1 1 100%;height:0}
.idx{max-width:72rem;margin:0 auto;padding:1.5rem 1rem 3rem;display:flex;flex-direction:column;gap:1.5rem}
.idx h1{font-size:1.5rem;font-weight:700;letter-spacing:-.015em}
.idx p{color:var(--ink-soft);max-width:62ch}
.idx h2{font-size:1rem;font-weight:700}

.idx ul{display:flex;flex-direction:column;gap:.5rem}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.75rem}

.state{scroll-margin-top:3.5rem;margin:0 auto;padding:2rem 1rem 0;max-width:72rem;font-size:1.5rem;font-weight:700;letter-spacing:-.015em}
.intro{margin:.5rem auto 0;padding:0 1rem;max-width:72rem;color:var(--ink-soft);font-size:.875rem}
.log-entry{display:flex;flex-direction:column;gap:.375rem;padding:.75rem 1rem;border-top:1px solid var(--line)}
.by{display:flex;flex-wrap:wrap;align-items:center;gap:.375rem;font-size:.8125rem;color:var(--ink-soft)}
.by b{font-weight:600;color:var(--ink)}
.log-entry p{font-size:var(--content);overflow-wrap:anywhere}
.log-entry p+p{margin-top:.375rem}
.links{display:flex;flex-wrap:wrap;gap:.375rem}
.lk{display:inline-flex;align-items:center;min-height:1.75rem;padding:0 .625rem;border:1px solid var(--line-strong);border-radius:var(--r-pill);color:var(--accent);font-family:var(--mono);font-size:.75rem}
.addnote{display:flex;flex-direction:column;gap:.5rem;padding:1rem;border-top:1px solid var(--line)}
.note{min-height:4.5rem;padding:.625rem .875rem;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-md);color:var(--ink-soft)}
.nolog{padding:.75rem 1rem;border-top:1px solid var(--line);color:var(--ink-soft)}

.actions{position:relative;flex:none}
.actions-btn{display:flex;align-items:center;gap:.375rem;min-height:2rem;padding:0 .625rem;border:1px solid var(--line-strong);border-radius:var(--r-pill);background:var(--surface);color:var(--ink);font:inherit;font-size:.875rem;font-weight:500}
.actions-list{position:absolute;top:calc(100% + .25rem);right:0;z-index:2;min-width:9rem;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-md);box-shadow:0 .25rem 1rem var(--line);overflow:hidden}
.actions-list>*{min-height:3rem;padding:.75rem 1rem;border:0;background:transparent;font:inherit;text-align:left}
.actions-list>*+*{border-top:1px solid var(--line)}
.actions-list>[aria-current="true"]{font-weight:600;color:var(--accent-strong);background:var(--accent-wash)}
.dbody{padding:1rem;border-top:1px solid var(--line)}
.icode{color:var(--accent);font-weight:500}
.card.flush{padding:0;gap:0}
.card.flush .row{border-top:0}

.bc{display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 .25rem .75rem -.25rem var(--line)}
.bc-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.625rem 1rem;border-bottom:1px solid var(--line)}
.bc-head.closed{border-bottom:0}
.bc-title{min-width:0;font-weight:700;overflow-wrap:anywhere}
.bc-chev{color:var(--ink-soft);font-size:1.125rem;line-height:1}

.bc-body{display:flex;flex-direction:column;gap:.75rem;padding:1rem}
.bc-body.flush{gap:0;padding:0}
.bc-foot{display:flex;border-top:1px solid var(--line)}
.bc-foot>*{flex:1;min-height:2.75rem;padding:.625rem;border:0;background:transparent;color:var(--accent);text-align:center}
.bc-foot>*+*{border-left:1px solid var(--line)}
.bc-body .tags{display:flex;flex-wrap:wrap;gap:.375rem}

.bc .icb{width:2.5rem;height:2.5rem}
.bc .row:first-child{border-top:0}
.bc .rows{border:0;border-radius:0;box-shadow:none;background:transparent}
</style>

<nav class="jnav" data-pages data-current="issue-log.html" aria-label="Mockups"><span class="sep"></span><a href="#s1">1 · A Log with notes</a><a href="#s2">2 · An empty Log</a></nav>
<h2 class="state" id="s1">1 · The card</h2><main class="screens"><figure><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>a screen of any app; four cards drawn once, the way every card is drawn.</dd></div><div class="cap-row"><dt>Header</dt><dd>the title at the left in bold, at most one control at the right: a button on a card that acts, the chevron on a card that collapses. A thin rule under it, none when the card is collapsed.</dd></div><div class="cap-row"><dt>Content</dt><dd>the body, with the card’s padding. Rows that run edge to edge sit here with no padding.</dd></div><div class="cap-row"><dt>Footer</dt><dd>optional. A row of equal text actions separated by thin rules, only on a card that has actions. The issue card has none.</dd></div><div class="cap-row"><dt>Shadow</dt><dd>one soft shadow on the whole card.</dd></div></dl></figcaption><div class="phone"><div class="bar"><span class="ttl2">The shape</span></div><div class="body"><section class="bc"><div class="bc-head"><span class="bc-title"><span class="icode">SW257</span> Every card is a Bulma card</span><button type="button" class="actions-btn">high<span aria-hidden="true">▾</span></button></div><div class="bc-body"><p>A header button on the right, a body, and no footer.</p></div></section><section class="bc"><div class="bc-head"><span class="bc-title">Log</span><span class="bc-chev" aria-hidden="true">⌄</span></div><div class="bc-body"><p>Open: the chevron points down.</p></div></section><section class="bc"><div class="bc-head closed"><span class="bc-title">Log</span><span class="bc-chev" aria-hidden="true">⌄</span></div></section><section class="bc"><div class="bc-head"><span class="bc-title">Add a bag</span><span class="bc-chev" aria-hidden="true">⌄</span></div><div class="bc-body"><p>Two actions in the footer, equal width.</p></div><div class="bc-foot"><button type="button">Add</button><button type="button">Cancel</button></div></section><section class="bc"><div class="bc-body"><p>A card without a title is only its content.</p></div></section></div></div></figure></main>
<h2 class="state" id="s2">2 · The issue page</h2><main class="screens"><figure><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>an issue’s page.</dd></div><div class="cap-row"><dt>Issue card</dt><dd>header: code and title, the priority button at the right. Content: tags and the description. No footer.</dd></div><div class="cap-row"><dt>References, Caps, Log</dt><dd>collapsed; the header is the whole tap target.</dd></div><div class="cap-row"><dt>Waits on</dt><dd>open, its rows run edge to edge under the header.</dd></div></dl></figcaption><div class="phone"><div class="bar"><span class="ttl2">The issue page</span></div><div class="body"><section class="bc"><div class="bc-head"><span class="bc-title"><span class="icode">SW257</span> Every card in the console is a Bulma-style card</span><button type="button" class="actions-btn">high<span aria-hidden="true">▾</span></button></div><div class="bc-body"><div class="tags"><span class="chip">hub-steward</span><span class="chip">Backlog · Doing</span><span class="chip">2d</span></div><p>The description of the issue, as it reads today.</p></div></section><section class="bc"><div class="bc-head closed"><span class="bc-title">References</span><span class="bc-chev" aria-hidden="true">⌄</span></div></section><section class="bc"><div class="bc-head closed"><span class="bc-title">Caps</span><span class="bc-chev" aria-hidden="true">⌄</span></div></section><section class="bc"><div class="bc-head closed"><span class="bc-title">Log</span><span class="bc-chev" aria-hidden="true">⌄</span></div></section><section class="bc"><div class="bc-head"><span class="bc-title">Waits on</span><span class="bc-chev" aria-hidden="true">⌄</span></div><div class="bc-body flush"><div class="rows"><div class="row"><span class="txt"><span class="ttl">SW242 Worker caps</span><span class="meta"><span class="chip">Done</span></span></span><span class="end" aria-hidden="true">›</span></div><div class="row"><span class="txt"> <h2 class="state" id="s3">3 · The cards drawn by hand before</h2><main class="screens"><figure><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>the places that drew their own cards before.</dd></div><div class="cap-row"><dt>Chat backlog card</dt><dd>header: the backlog’s name; content: its count; footer: Open.</dd></div><div class="cap-row"><dt>Access card</dt><dd>header: the group’s name with the take-away button at the right; content: the level.</dd></div><div class="cap-row"><dt>Board card</dt><dd>content only: the issue row.</dd></div><div class="cap-row"><dt>Assistant form</dt><dd>header: the form’s title; content: the fields; footer: the submit button.</dd></div></dl></figcaption><div class="phone"><div class="bar"><span class="ttl2">Other screens</span></div><div class="body"><section class="bc"><div class="bc-head"><span class="bc-title">Software</span></div><div class="bc-body"><span class="line">5 issues in 6 steps</span></div><div class="bc-foot"><a href="#">Open</a></div></section><section class="bc"><div class="bc-head"><span class="bc-title">Contributors</span><button type="button" class="icb" aria-label="Take away">×</button></div><div class="bc-body"><span class="chip">Can see</span></div></section><section class="bc"><div class="bc-body flush"><div class="rows"><div class="row"><span class="txt"><span class="ttl">SW9 Write the manual</span><span class="meta"><span class="chip">hub-steward</span></span></span></div></div></div></section><section class="bc"><div class="bc-head"><span class="bc-title">Join the group sale</span></div><div class="bc-body"><div class="field"><span class="flabel">Bags</span><div class="input">2</div></div></div><div class="bc-foot"><button type="button">Join</button></div></section></div></div></figure></main>
