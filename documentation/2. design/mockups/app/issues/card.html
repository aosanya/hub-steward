<style>
body{background:var(--bg-alt)}
figure,dl,dd{margin:0}
.code{font-family:var(--mono);font-size:.9375rem;color:var(--ink-soft);overflow-wrap:anywhere}
.screens{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(24rem,100%),24rem));justify-content:center;gap:2.5rem 2rem;padding:2rem 1rem 3rem}
figure{display:flex;flex-direction:column;gap:.75rem;min-width:0;max-width:100%}
.cap{width:0;min-width:100%;max-width:40rem;font-size:1rem;line-height:1.4;color:var(--ink-soft)}
.cap-rows{display:grid;grid-template-columns:6.5rem 1fr;gap:.375rem .75rem}
.cap-row{display:contents}
.cap-rows dt{font-weight:600;color:var(--ink)}
.cap-rows dd{min-width:0;overflow-wrap:anywhere}
.phone{position:relative;display:flex;flex-direction:column;flex:none;width:24rem;max-width:100%;min-height:40rem;overflow:hidden;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 .5rem 1.5rem var(--line)}
.state{scroll-margin-top:3.5rem;margin:0 auto;padding:2rem 1rem 0;max-width:72rem;font-size:1.875rem;font-weight:700;letter-spacing:-.015em}
.intro{margin:.5rem auto 0;padding:0 1rem;max-width:72rem;color:var(--ink-soft);font-size:1.1rem}
.win .bar{grid-template-columns:minmax(max-content,1fr) minmax(0,max-content) minmax(max-content,1fr)}
</style>

<body>
<nav class="jnav" data-pages data-current="issues/card.html" data-base="../" aria-label="Mockups"><span class="sep"></span><a href="#s1">1 · A Log with notes</a><a href="#s2">2 · An empty Log</a></nav>
<h2 class="state" id="s1">1 · The card</h2><main class="screens"><figure><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>a screen of any app; four cards drawn once, the way every card is drawn.</dd></div><div class="cap-row"><dt>Header</dt><dd>the title at the left in bold, at most one control at the right: a button on a card that acts, the chevron on a card that collapses. A thin rule under it, none when the card is collapsed.</dd></div><div class="cap-row"><dt>Content</dt><dd>the body, with the card’s padding. Rows that run edge to edge sit here with no padding.</dd></div><div class="cap-row"><dt>Footer</dt><dd>optional. A row of equal text actions separated by thin rules, only on a card that has actions. The issue card has none.</dd></div><div class="cap-row"><dt>Shadow</dt><dd>one soft shadow on the whole card.</dd></div></dl></figcaption><div class="phone"><header class="bar" data-title="The shape" data-agency="Hub Steward SWE"></header>
  <div class="body"><section class="card"><div class="card-head"><span class="card-title"><span class="issue-code">SW257</span> Every card is a Bulma card</span><div class="actions"><button type="button" class="actions-btn">Priority: High<span aria-hidden="true">▾</span></button></div></div><div class="card-body"><p>A header button on the right, a body, and no footer.</p></div></section><section class="card"><div class="card-head"><button type="button" class="card-toggle" aria-expanded="true"><span class="card-title">Log</span><span class="card-chevron" aria-hidden="true">⌄</span></button></div><div class="card-body"><p>Open: the chevron points down.</p></div></section><section class="card"><div class="card-head closed"><button type="button" class="card-toggle" aria-expanded="false"><span class="card-title">Log</span><span class="card-chevron" aria-hidden="true">⌄</span></button></div></section><section class="card"><div class="card-head"><button type="button" class="card-toggle" aria-expanded="true"><span class="card-title">Add a bag</span><span class="card-chevron" aria-hidden="true">⌄</span></button></div><div class="card-body"><p>Two actions in the footer, equal width.</p></div><div class="card-foot"><button type="button">Add</button><button type="button">Cancel</button></div></section><section class="card"><p>A card without a title is only its content.</p></section></div></div></figure></main>
<h2 class="state" id="s2">2 · The issue page</h2><main class="screens"><figure><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>an issue’s page.</dd></div><div class="cap-row"><dt>Issue card</dt><dd>header: the code. Content: the title, the tags with the priority button among them, and the description. No footer.</dd></div><div class="cap-row"><dt>References, Caps, Log</dt><dd>collapsed; the header is the whole tap target.</dd></div><div class="cap-row"><dt>Waits on</dt><dd>open, one issue card for each issue under the header, with its step among the tags.</dd></div></dl></figcaption><div class="phone"><header class="bar" data-back="All issues" data-title="SW257" data-agency="Hub Steward SWE"></header>
  <div class="body"><div class="issue-wide"><div class="issue-main"><section class="card"><div class="card-head"><span class="card-title"><span class="issue-code">SW257</span></span></div><div class="card-body"><span class="issue-title full">Every card in the console is a Bulma-style card</span><span class="issue-tags"><span class="chip hued" style="--hue:207;--shade:2">hub-steward</span><span class="chip">Backlog · Doing</span><div class="actions"><button type="button" class="actions-btn">Priority: High<span aria-hidden="true">▾</span></button></div><span class="chip" title="Created Mon 9 Nov 2026, 09:12">2 days</span></span><div class="issue-body"><p>The description of the issue, as it reads today.</p></div></div></section></div><div class="issue-side"><section class="card flush"><div class="card-head closed"><button type="button" class="card-toggle" aria-expanded="false"><span class="card-title">References</span><span class="card-chevron" aria-hidden="true">⌄</span></button></div></section><section class="card flush"><div class="card-head closed"><button type="button" class="card-toggle" aria-expanded="false"><span class="card-title">Caps</span><span class="card-chevron" aria-hidden="true">⌄</span></button></div></section><section class="card flush"><div class="card-head closed"><button type="button" class="card-toggle" aria-expanded="false"><span class="card-title">Log</span><span class="card-chevron" aria-hidden="true">⌄</span></button></div></section><section class="card"><div class="card-head"><button type="button" class="card-toggle" aria-expanded="true"><span class="card-title">Waits on</span><span class="card-chevron" aria-hidden="true">⌄</span></button></div><div class="card-body"><div class="issue-row static"><section class="card"><div class="card-head"><span class="card-title"><span class="issue-code">SW242</span></span></div><div class="card-body"><span class="issue-title">Worker caps</span><span class="issue-tags issue-line"><span class="chip hued" style="--hue:207;--shade:2">hub-steward</span><span class="chip hued" style="--hue:315;--shade:0">Done</span><span class="chip">5 days</span></span></div></section></div><div class="issue-row static"><section class="card"><div class="card-head"><span class="card-title"><span class="issue-code">SW251</span></span></div><div class="card-body"><span class="issue-title">Collapsed cards</span><span class="issue-tags issue-line"><span class="chip hued" style="--hue:207;--shade:2">hub-steward</span><span class="chip hued" style="--hue:315;--shade:0">Done</span><span class="chip">5 days</span></span></div></section></div></div></section></div></div></div><nav class="tabs" data-tabs data-chosen="" data-badge="3"></nav></div></figure></main><main class="wide-screens"><figure><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>An issue's page, opened from a row of a list or a card of a board. The card with the code, the title, the tag bubbles and the description is the same card as today. Phone: as built, one column, the card first and the room for the Log and References sections under it. Wide window: the page uses the window instead of one phone-width column. The card keeps a readable width, never more than 40rem, and the Log and References sections sit beside it; when the window is too narrow for both, they sit under it as on a phone.</dd></div><div class="cap-row"><dt>Layout</dt><dd>Two flex columns that wrap from 48rem up: the card column is <span class="code">flex: 1 1 24rem</span> with <span class="code">max-width: 40rem</span>, and the sections column is <span class="code">flex: 1 1 18rem</span>, so it takes the rest of the width. Below 48rem the page is the single column of today. The sections column is drawn empty and outlined; its content is drawn in the Issue log mockup and in the References design, not here. The send-to-backlog button, the Waits on cards and the Source card are not drawn: the button and Waits on sit in the sections column, Source under the description.</dd></div><div class="cap-row"><dt>Age</dt><dd>The last bubble of the card's tag line is the issue's age, a plain grey bubble in the same style as the rows and cards of the lists and the board: minutes under one hour, hours under one day, days from one day (D124). The exact date and time is its tap or hover text ("Created Mon 9 Nov 2026, 09:12"). On a Done or Cancelled issue it is how long the issue took, created to finished, and the text names both times.</dd></div><div class="cap-row"><dt>Built</dt><dd>Phone is built. The wide layout is new.</dd></div><div class="cap-row"><dt>Example data</dt><dd>The issue, its tags and its text are drawn for this page, not read from the hub.</dd></div></dl></figcaption><div class="pair"><div class="win w-med"><header class="bar" data-back="All issues" data-title="SW194" data-agency="Hub Steward SWE"></header><div class="body"><div class="issue-wide"><div class="issue-main"><section class="card"><div class="card-head"><span class="card-title"><span class="issue-code">SW194</span></span></div><div class="card-body"><span class="issue-title full">Every tag on an issue card is a bubble, coloured from its text</span><span class="issue-tags"><span class="chip hued" style="--hue:230;--shade:3">hub-steward-swe</span><span class="chip hued" style="--hue:284;--shade:4">Backlog</span><span class="chip">Backlog · To do</span><div class="actions"><button type="button" class="actions-btn">Priority: Critical<span aria-hidden="true">▾</span></button></div><span class="chip" title="Created Mon 9 Nov 2026, 09:12">2 days</span></span><div class="issue-body"><p>A tag on an issue card is a rounded bubble. Its colour is taken from its text, so the same tag has the same colour on every card, row and page.</p><ul><li>Write the failing test</li><li>Colour the bubble from the tag text</li></ul></div></div></section></div><div class="issue-side"><div class="room">Room for the Log and References sections. Below the description here; beside it on a wide window. Not drawn.</div></div></div></div><nav class="tabs" data-tabs data-chosen="" data-badge="3"></nav></div><div class="win w-wide"><header class="bar" data-back="All issues" data-title="SW194" data-agency="Hub Steward SWE"></header><div class="body"><div class="issue-wide"><div class="issue-main"><section class="card"><div class="card-head"><span class="card-title"><span class="issue-code">SW194</span></span></div><div class="card-body"><span class="issue-title full">Every tag on an issue card is a bubble, coloured from its text</span><span class="issue-tags"><span class="chip hued" style="--hue:230;--shade:3">hub-steward-swe</span><span class="chip hued" style="--hue:284;--shade:4">Backlog</span><span class="chip">Backlog · To do</span><div class="actions"><button type="button" class="actions-btn">Priority: Critical<span aria-hidden="true">▾</span></button></div><span class="chip" title="Created Mon 9 Nov 2026, 09:12">2 days</span></span><div class="issue-body"><p>A tag on an issue card is a rounded bubble. Its colour is taken from its text, so the same tag has the same colour on every card, row and page.</p><ul><li>Write the failing test</li><li>Colour the bubble from the tag text</li></ul></div></div></section></div><div class="issue-side"><div class="room">Room for the Log and References sections. Below the description here; beside it on a wide window. Not drawn.</div></div></div></div><nav class="tabs" data-tabs data-chosen="" data-badge="3"></nav></div></div></figure></main>
<h2 class="state" id="s3">3 · The cards drawn by hand before</h2><main class="screens"><figure><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>the places that drew their own cards before.</dd></div><div class="cap-row"><dt>Chat backlog card</dt><dd>header: the backlog’s name; content: its count; footer: Open.</dd></div><div class="cap-row"><dt>Access card</dt><dd>header: the group’s name with the take-away button at the right; content: the three levels as a choice, and the role it uses.</dd></div><div class="cap-row"><dt>Board card</dt><dd>header: the code; content: the title and its tags.</dd></div><div class="cap-row"><dt>Assistant form</dt><dd>header: the form’s title; content: the fields; footer: the submit button.</dd></div></dl></figcaption><div class="phone"><header class="bar" data-title="Other screens" data-agency="Hub Steward SWE"></header>
  <div class="body"><section class="card"><div class="card-head"><span class="card-title">Software</span></div><div class="card-body"><span class="rm-line">5 issues in 6 steps</span></div><div class="card-foot"><a class="btn quiet">Open</a></div></section><section class="card"><div class="card-head"><span class="card-title">Contributors</span><button type="button" class="icb" aria-label="Take away access from Contributors">×</button></div><div class="card-body"><div class="seg" role="group" aria-label="Access for Contributors"><button type="button" aria-pressed="true">Can see</button><button type="button" aria-pressed="false">Can move</button><button type="button" aria-pressed="false">Can edit</button></div><p class="sub">Uses the Backlogs as: no role yet</p></div></section><div class="issue-row static"><section class="card"><div class="card-head"><span class="card-title"><span class="issue-code">SW9</span></span></div><div class="card-body"><span class="issue-title">Write the manual</span><span class="issue-tags issue-line"><span class="chip hued" style="--hue:207;--shade:2">hub-steward</span><span class="chip">5 days</span></span></div></section></div><section class="card"><div class="card-head"><span class="card-title">Join the group sale</span></div><div class="card-body"><div class="field"><span class="flabel">Bags</span><div class="input">2</div></div></div><div class="card-foot"><button type="button">Join</button></div></section></div></div></figure></main>
