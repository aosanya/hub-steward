<p class="intro">The step of each issue on an issue's Waits on and Waited on by cards. Built in the app.</p>
<h2 class="state" id="s1">1 · Waits on with each issue's step</h2><main class="screens"><figure><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>The issue page of an issue that waits on two others. Each card of the Waits on card carries, beside its repo and backlog bubbles and its priority, a bubble with the issue's current step: Done for a dependency that is finished (so the owner sees at once why it no longer holds this issue), In Progress for one that is under way. The card of the issues that wait on this one, Waited on by, draws its cards the same way. A dependency that is Done shows its priority as a plain chip, not a button. The step bubble takes its colour from the step's name, the rule the board's step names use; it is the same bubble, not a second one. The issue's own top card is unchanged: its backlog and step stay one fact. The first four steps of the backlog read To do, In Progress, Done and Cancelled.</dd></div><div class="cap-row"><dt>Filled by</dt><dd><span class="code">taskmanager_task_read</span> for each issue the traverse names; its <span class="code">step</span> is the bubble. No extra call.</dd></div><div class="cap-row"><dt>Example data</dt><dd>The issue, the codes, titles and ages are drawn for this page, not read from the hub.</dd></div></dl></figcaption><div class="phone"><header class="bar" data-back="All issues" data-title="HS-002" data-agency="Hub Steward SWE"></header><div class="body"><div class="issue-wide"><div class="issue-main"><section class="card"><div class="card-head"><span class="card-title"><span class="issue-code">HS-002</span></span></div><div class="card-body"><span class="issue-title full">Import the Siaya agency</span><span class="issue-tags"><span class="chip hued" style="--hue:207;--shade:2">hub-steward</span><span class="chip hued" style="--hue:284;--shade:4">Backlog</span><span class="chip">Backlog · In Progress</span><div class="actions"><button type="button" class="actions-btn" aria-expanded="false">Priority: Medium<span aria-hidden="true">▾</span></button></div><div class="actions"><button type="button" class="actions-btn" aria-expanded="false">Effort: Unknown<span aria-hidden="true">▾</span></button></div><span class="chip">2d</span></span></div></section></div><div class="issue-side"><section class="card"><div class="card-head"><button type="button" class="card-toggle" aria-expanded="true"><span class="card-title">Waits on</span><span class="card-chevron" aria-hidden="true">⌄</span></button></div><div class="card-body"><div class="issue-row"><section class="card"><div class="card-head"><span class="card-title"><span class="issue-code">HS-005</span></span></div><div class="card-body"><button type="button" class="open"><span class="issue-title">Switch on the custody module</span></button><span class="issue-tags issue-line"><span class="chip hued" style="--hue:207;--shade:2">hub-steward</span><span class="chip hued" style="--hue:284;--shade:4">Backlog</span><span class="chip hued" style="--hue:315;--shade:0">Done</span><span class="chip">Priority: Medium</span><span class="chip">2d</span></span></div></section></div><div class="issue-row"><section class="card"><div class="card-head"><span class="card-title"><span class="issue-code">HS-007</span></span></div><div class="card-body"><button type="button" class="open"><span class="issue-title">Fix the import route</span></button><span class="issue-tags issue-line"><span class="chip hued" style="--hue:207;--shade:2">hub-steward</span><span class="chip hued" style="--hue:284;--shade:4">Backlog</span><span class="chip hued" style="--hue:258;--shade:1">In Progress</span><div class="actions"><button type="button" class="actions-btn" aria-expanded="false">Priority: Critical<span aria-hidden="true">▾</span></button></div><span class="chip">2d</span></span></div></section></div></div></section><section class="card"><div class="card-head"><button type="button" class="card-toggle" aria-expanded="true"><s
