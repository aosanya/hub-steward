<p class="intro">A backlog's page, opened from its board (decisions 53, 58 and 60), and access to a backlog by group (decision 54). Drawn for the owner to change; no code behind it.</p>
<h2 class="state" id="s1">1 · A backlog's page</h2><main class="screens"><figure><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>a backlog's page, opened by the Backlog link on its board: its steps in order with how many issues each holds, then the groups that have access and at what level, Can see, Can move or Can edit. Access is given to groups, not people, and to the whole backlog, not to a step. The Product owner group always has Can edit.</dd></div><div class="cap-row"><dt>Filled by</dt><dd><span class="code">list_task_states</span><br><span class="code">backlog access (SW32)</span></dd></div><div class="cap-row"><dt>Example data</dt><dd>The issue titles, repos, counts and times are drawn for this page, not read from the boards. This is the Hub Steward SWE agency; its roles are the Product owner and the Triager (decisions 45 and 49). The group names are drawn for this page.</dd></div></dl></figcaption><div class="phone"><header class="bar" data-back="List" data-title="Software" data-agency="Hub Steward SWE"></header><div class="body"><div class="head"><p class="sub">Backlog · 6 steps</p></div><a class="btn quiet">Edit this backlog</a><h2 class="heading">Steps, in order</h2><div class="rows"><div class="row"><span class="txt"><span class="ttl">To do</span></span><span class="end">3 issues</span></div><div class="row"><span class="txt"><span class="ttl">In Progress</span></span><span class="end">1 issue</span></div><div class="row"><span class="txt"><span class="ttl">Review</span></span><span class="end">No issues</span></div><div class="row"><span class="txt"><span class="ttl">Testing</span></span><span class="end">1 issue</span></div><div class="row"><span class="txt"><span class="ttl">Done</span></span><span class="end">No issues</span></div><div class="row"><span class="txt"><span class="ttl">Cancelled</span></span><span class="end">No issues</span></div></div><h2 class="heading">Who has access</h2><div class="rows"><div /span><span class="end">No issues</span></div><div class="row"><span class="txt"><span class="ttl">Dropped</span></span><span class="end">No issues</span></div></div><h2 class="heading">Who has access</h2><div class="rows"><div class="row"><span class="txt"><span class="ttl">Product owner</span></span><span class="end"><span class="chip accent">Can edit</span></span></div><div class="row"><span class="txt"><span class="ttl">Core team</span></span><span class="end"><span class="chip accent">Can move</span></span></div></div><a class="btn quiet">Change who has access</a><p class="sub">A group that can edit can also move and see.</p></div><nav class="tabs" data-tabs data-chosen="" data-badge="3"></nav></div></figure></main><h2 class="state" id="s2">2 · What a group sees</h2><main class="screens"><figure><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>the Backlogs list, reached by tapping Backlogs on Home, as a Contributor sees it: only the backlogs the group can see. Documentation is not listed and neither are its issues, so All issues counts only the five of Software.</dd></div><div class="cap-row"><dt>Filled by</dt><dd><span class="code">list_tasks</span><br><span class="code">backlog access (SW32)</span></dd></div><div class="cap-row"><dt>Example data</dt><dd>The issue titles, repos, counts and times are drawn for this page, not read from the boards. This is the Hub Steward SWE agency; its roles are the Product owner and the Triager (decisions 45 and 49). The group names are drawn for this page.</dd></div></dl></figcaption><div class="phone"><header class="bar" data-title="Backlogs" data-agency="Hub Steward SWE"></header><div class="body"><div class="rows"><a class="row" href="lists.html"><span class="txt"><span class="ttl">All issues</span><span class="meta">5 issues</span></span><span class="end" aria-hidden="true">›</span></a><a class="row" href="kanban.html#t-software"><span class="txt"><span class="ttl">Software</span><span
