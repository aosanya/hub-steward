<style>
:root{font-size:90%;--content:.9rem;--r-sm:.5rem;--r-md:.875rem;--r-pill:999px;--sans:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;--bg:#EDF0EC;--bg-alt:#E3E8E3;--surface:#FBFCFA;--ink:#1B2430;--ink-soft:#3D4652;--line:rgba(27,36,48,.16);--line-strong:rgba(27,36,48,.4);--accent:#703C0F;--accent-strong:#542E0B;--accent-wash:rgba(112,60,15,.1);--on-accent:#FFFCF9;--danger:#A8402E;--success:#3F7D45;--info:#35618F;--info-wash:rgba(53,97,143,.1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-alt);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.5}
h2,p,figure,dl,dd{margin:0}
a{color:inherit;text-decoration:none}
.ic{flex:none;width:1.25rem;height:1.25rem;stroke-width:1.75}
.code{font-family:var(--mono);font-size:.75rem;color:var(--ink-soft);overflow-wrap:anywhere}
.screens{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(27rem,100%),27rem));justify-content:center;gap:2.5rem 2rem;padding:2rem 1rem 3rem}
figure{display:flex;flex-direction:column;gap:.75rem;min-width:0;max-width:100%}
.cap{width:0;min-width:100%;max-width:50rem;font-size:.8125rem;line-height:1.4;color:var(--ink-soft)}
.cap-rows{display:grid;grid-template-columns:6.5rem 1fr;gap:.375rem .75rem}
.cap-row{display:contents}
.cap-rows dt{font-weight:600;color:var(--ink)}
.cap-rows dd{margin:0;min-width:0;overflow-wrap:anywhere}
.phone{font-size:.8125rem;position:relative;display:flex;flex-direction:column;flex:none;width:27rem;max-width:100%;min-height:50rem;overflow:hidden;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 .5rem 1.5rem var(--line)}
.bar{position:sticky;top:0;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:.5rem;min-height:3rem;padding:0 .5rem;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-title{grid-column:2;max-width:14rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1.125rem;font-weight:700;line-height:1.2;text-align:center}
.back{display:inline-flex;align-items:center;gap:.125rem;min-height:3rem;padding:0 .5rem;border:0;background:transparent;color:var(--accent);white-space:nowrap}
.body{flex:1;display:flex;flex-direction:column;gap:.75rem;padding:1rem}
.line{font-size:.8125rem;color:var(--ink-soft)}
.rows{display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 1px 2px var(--line)}
.row{display:flex;align-items:center;gap:.75rem;min-height:3.5rem;padding:.5rem 1rem;color:var(--ink)}
.row+.row{border-top:1px solid var(--line)}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:.125rem}
.row .ttl{font-weight:600;overflow-wrap:anywhere}
.row .end{flex:none;color:var(--ink-soft)}
.state{scroll-margin-top:3.5rem;margin:0 auto;padding:2rem 1rem 0;max-width:72rem;font-size:1.5rem;font-weight:700;letter-spacing:-.015em}
.intro{margin:.5rem auto 0;padding:0 1rem;max-width:72rem;color:var(--ink-soft);font-size:.875rem}
</style>

<p class="intro">The screens of the Assets &amp; Works section, drawn for a town council with sample data, one figure for each submenu. Each screen opens from its row in the section's submenu list.</p>
<h2 class="state" id="roads-paths">Roads &amp; Paths</h2><main class="wide-screens"><figure id="fig-roads-paths"><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>the screen the Roads &amp; Paths submenu of Assets &amp; Works opens: a list of roads and paths, each row carrying its name and the kind of thing it is. Tapping a row opens it. The tool supplies no condition for a road, so the condition is left out of the rows. Back reads Assets &amp; Works.</dd></div><div class="cap-row"><dt>Wide</dt><dd>Phone: as drawn, one column, with the kind on a second line under each name. Wide window (tablet width, 42rem): the same list in the window's width, with the kind as a chip at the right of each name. Both versions show the same six sample rows. Tapping a row opens the road as on the phone, since no detail screen is drawn yet; a list beside a detail would wait for that screen.</dd></div><div class="cap-row"><dt>Filled by</dt><dd><span class="code">assetmanager_asset_list</span> (rows, narrowed by category)</dd></div><div class="cap-row"><dt>Example data</dt><dd>The road and path names are sample names invented for this page, not read from a hub.</dd></div></dl></figcaption><div class="pair"><div class="win w-med"><header class="bar"><a class="back"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Assets &amp; Works</a><span class="bar-title">Roads &amp; Paths</span></header><div class="body"><div class="rows fluid-rows"><a class="row"><span class="txt"><span class="ttl">Mill Street</span></span><span class="meta"><span class="chip">Road</span></span><span class="end"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span></a><a class="row"><span class="txt"><span class="ttl">Orchard Lane</span></span><span class="meta"><span class="chip">Road</span></span><span class="end"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span></a><a class="row"><span class="txt"><span class="ttl">Station Road</span></span><span class="meta"><span class="chip">Road</span></span><span class="end"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span></a><a class="row"><span class="txt"><span class="ttl">Riverside Path</span></span><span class="meta"><span class="chip">Path</span></span><span class="end"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span></a><a class="row"><span class="txt"><span class="ttl">Church Footpath</span></span><span class="meta"><span class="chip">Path</span></span><span class="end"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span></a><a class="row"><span class="txt"><span class="ttl">School Lane Cycle Path</span></span><span class="meta"><span class="chip">Path</span></span><span class="end"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span></a></div></div><nav class="tabs" data-tabs data-chosen="home"></nav></div><div class="phone"><header class="bar"><a class="back"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Assets &amp; Works</a><span class="bar-title">Roads &amp; Paths</span></header><div class="body"><div class="rows"><a class="r
