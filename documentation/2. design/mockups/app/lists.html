<p class="intro">The lists: all issues, and the list of one backlog (decision 60). Drawn for the owner to change; no code behind it.</p>
<h2 class="state" id="s1">1 · All issues</h2><main class="screens"><figure><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>the All issues row of the Backlogs list, reached by tapping Backlogs on Home: every issue of every backlog you can see, in priority order. Each row shows the code and the short title and nothing else: no number, no tags, no state, no priority; the code is in the accent colour and the title is plain text, two lines at most. A row shows the code and the short title, with the issue's tags as small pills under it and nothing else. Tapping a pill adds that tag to the filter without opening the issue; tapping anywhere else on the row opens the issue. Tags chosen together narrow the list. The search field, the count and the chosen tags form one filter bar that stays pinned under the header while the rows scroll; the search matches every word typed against the code, the title and the tags; the count reads 12 of 1661 issues while a search or a tag is active.</dd></div><div class="cap-row"><dt>Age</dt><dd>The last bubble of a row is its age, a plain grey bubble that shares the tag line, so a row on a phone is no taller. It counts from when the issue was created: under one hour in minutes ("1 min", "59 min"), from one hour to under one day in hours ("1 h", "5 h", "23 h"), from one day in days ("1 day", "120 days"), never weeks or months (D124). Tapping or hovering it shows the exact date and time. A Done or Cancelled issue shows how long it took, created to finished, in the same units. The age bubble is not a filter: tapping it does nothing.</dd></div><div class="cap-row"><dt>Filled by</dt><dd><span class="code">list_tasks</span></dd></div><div class="cap-row"><dt>Example data</dt><dd>The issue titles, repos, counts and times are drawn for this page, not read from the boards. This is the Hub Steward SWE agency; its roles are the Product owner and the Triager (decisions 45 and 49).</dd></div></dl></figcaption><div class <script>
document.querySelectorAll('.backlog').forEach(function(root){
var chosen=new Set((root.dataset.start||'').split(',').filter(Boolean));
var rows=root.querySelectorAll('[data-tags]');
var chips=root.querySelector('.chosen');
function toggle(t){chosen.has(t)?chosen.delete(t):chosen.add(t);draw();}
function draw(){
var shown=0;
rows.forEach(function(r){var tags=r.dataset.tags.split('|');var ok=Array.from(chosen).every(function(t){return tags.indexOf(t)>-1;});r.hidden=!ok;if(ok)shown++;
r.querySelectorAll('.tg').forEach(function(b){b.setAttribute('aria-pressed',chosen.has(b.dataset.tag)?'true':'false');});});
chips.innerHTML='';
chosen.forEach(function(t){var b=document.createElement('button');b.type='button';b.className='sg';b.textContent=t+' ✕';b.onclick=function(){toggle(t);};chips.appendChild(b);});
root.querySelector('.count').textContent=chosen.size?shown+' of '+rows.length+(rows.length===1?' issue':' issues'):shown+(shown===1?' issue':' issues');
var none=root.querySelector('.none');if(none)none.style.display=shown?'none':'block';
var rl=root.querySelector('.rows');if(rl)rl.style.display=shown?'flex':'none';
root.querySelectorAll('.col').forEach(function(c){var n=c.querySelectorAll('[data-tags]:not([hidden])').length;c.querySelector('.n').textContent=n;c.querySelector('.cnone').style.display=n?'none':'block';});
}
root.querySelectorAll('.tg').forEach(function(b){b.onclick=function(){toggle(b.dataset.tag);};});
draw();
});
</script>
