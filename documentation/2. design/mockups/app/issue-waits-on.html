<p class="intro">The step of each issue on an issue's Waits on and Waited on by cards. Drawn for the owner to change; no code behind it.</p>
<h2 class="state" id="s1">1 · Waits on with each issue's step</h2><main class="screens"><figure><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>The issue page of an issue that waits on two others. Each row of the Waits on card carries, beside its repo and priority bubbles, a bubble with the issue's current step: Done for a dependency that is finished (so the owner sees at once why it no longer holds this issue), In Progress for one that is under way. The card of the issues that wait on this one, Waited on by, draws its rows the same way. The step bubble takes its colour from the step's name, the rule the board's step names use; it is the same bubble, not a second one. The issue's own top card is unchanged: its backlog and step stay one fact. The first four steps of the backlog read To do, In Progress, Done and Cancelled.</dd></div><div class="cap-row"><dt>Filled by</dt><dd><span class="code">taskmanager_task_read</span> for each issue the traverse names; its <span class="code">step</span> is the bubble. No extra call.</dd></div><div class="cap-row"><dt>Example data</dt><dd>The issue, the codes, titles and ages are drawn for this page, not read from the hub.</dd></div></dl></figcaption><div class="phone"><header class="bar"><a class="back"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>All issues</a><span class="bar-title">HS-002</span><span class="bar-action"></span></header><div class="body"><div class="icard top"><div class="card-head"><span class="card-title"><span class="icode">HS-002</span></span></span></div><div class="card-body"><span class="ttl">Import the municipality</span><span class="meta"><span class="chip ">hub-steward</span><span class="chip ">Backlog · In Progress</span><span class="chip ">medium</span></div></div><div class="card"><div class="card-head"><span class="card-title">Waits on</span><span class="card-chevron">⌄</span></div><div class="card-body"><div class="icard"><div class="card-head"><span class="card-title"><span class="icode">HS-005</span></span><div class="actions"><button type="button" class="actions-btn" aria-expanded="false">medium<span aria-hidden="true">▾</span></button></div></div><div class="card-body"><span class="ttl itl">Switch on the custody module</span><span class="meta"><span class="chip ">hub-steward</span><span class="chip hued" style="--hue:315;--shade:0">Done</span><span class="chip ">2d</span></span></div></div><div class="icard"><div class="card-head"><span class="card-title"><span class="icode">HS-007</span></span><div class="actions"><button type="button" class="actions-btn" aria-expanded="false">critical<span aria-hidden="true">▾</span></button></div></div><div class="card-body"><span class="ttl itl">Fix the import route</span><span class="meta"><span class="chip ">hub-steward</span><span class="chip hued" style="--hue:224;--shade:1">In Progress</span><span class="chip ">2d</span></span></div></div></div></div><div class="card"><div class="card-head"><span class="card-title">Waited on by</span><span class="card-chevron">⌄</span></div><div class="card-body"><div class="icard"><div class="card-head"><span class="card-title"><span class="icode">HS-011</span></span><div class="actions"><button type="button" class="actions-btn" aria-expanded="false">medium<span aria-hidden="true">▾</span></button></div></div><div class="card-body"><span class="ttl itl">Check the 46 workflows</span><span class="meta"><span class="chip ">hub-steward</span><span class="chip hued" style="--hue:198;--shade:4">To do</span><span class="chip ">2d</span></span></div></div></div></div></div></div></figure></main>
