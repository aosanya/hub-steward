<p class="intro">The Kanban board of a backlog, opened from its row on the Backlogs list (decisions 51, 58 and 62). Drawn for the owner to change; no code behind it.</p>
<h2 class="state" id="s1">1 · A backlog's board</h2><main class="screens"><figure id="t-software"><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>a backlog row of the Backlogs list opens its board (decision 60). One column for each step of the backlog, in order, and one card for each issue; the columns scroll sideways and the next one peeks in. A List | Board switch under the title flips to this backlog's list. All issues and a smart backlog have the same switch and the same search box, and open on the board; their columns are the steps of the backlogs their issues live in. A card shows the code and the short title and its tag pills; tapping a pill filters every column, tapping the card opens the issue. The top bar holds only the back link to Backlogs, Select (for a person who may move issues) and the Backlog link, which opens the backlog's page with its steps and its access; the backlog's name is the headline under the bar, so a long name wraps and never crowds the buttons. Cards are moved by asking in Chat ("move 2 to In Progress"); there is no dragging yet.</dd></div><div class="cap-row"><dt>Age</dt><dd>The last bubble of a card is its age, a plain grey bubble (the app's Chip with no colour), so it does not compete with the repo and backlog bubbles, and it shares their line, so a card is no taller on a phone. It counts from when the issue was created: under one hour in minutes ("1 min", "59 min"), from one hour to under one day in hours ("1 h", "5 h", "23 h"), from one day in days ("1 day", "3 days", "120 days"); there are no weeks or months (D124). Tapping or hovering the bubble shows the exact date and time. A Done or Cancelled card shows how long the issue took, created to finished, in the same units, not a growing age; the drawing shows HS-009 Done after 2 days and HS-010 Cancelled after 5 h, and their hover text names both times.</dd></div><div class="cap-row"><dt>Filled by</dt><dd><span class="code">list_tasks (needs SW19)</span><br><span class="code">list_task_states</span></dd></div><div class="cap-row"><dt>Example data</dt><dd>The issue titles, repos, counts and times are drawn for this page, not read from the boards. This is the Hub Steward SWE agency; its roles are the Product owner and the Triager (decisions 45 and 49).</dd></div></dl></figcaption><div class="phone"><header class="bar" data-back="Backlogs" data-action="Select" data-also="Backlog" data-agency="Hub Steward SWE"></header><div class="body"><h1 class="headline">Software</h1><div class="backlog" data-start=""><div class="filter-bar"><div class="input search-box"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input type="search" aria-label="Search issues" placeholder="Search issues" readonly></div><p class="sub count"></p><div class="chosen"></div></div><div class="seg" role="group" aria-label="View"><button type="button" href="lists.html#l-software" aria-pressed="false">List</button><button type="button" href="kanban.html#t-software" aria-pressed="true">Board</button></div><div class="bb-board"><section class="bb-col" aria-label="To do"><h3><span>To do</span><span class="n"></span></h3><div class="issue-row" data-tags="Ready|community-hubs|Software|To do"><section class="card"><div class="card-head"><span class="card-title"><span class="issue-code">HS-003</span></span></div><div class="card-body"><button type="button" class="open"><span class="issue-title">Record the voice clips</span></button><span class="issue-tags issue-line"><button type="button" class="chip tg hued" style="--hue:73;--shade:0" data-tag="community-hubs">community-hubs</button><div class="actions"><button type="button" class="actions-btn" aria-expanded="false">Priority: Critical<span aria-hidden="true">▾</span></button></div><span class="chip" title="Created Wed 11 Nov 2026, 11:01">12 min</span> <script>
document.querySelectorAll('.seg>button[href]').forEach(function(b){b.onclick=function(){location.href=b.getAttribute('href');};});
document.querySelectorAll('.backlog').forEach(function(root){
var chosen=new Set((root.dataset.start||'').split(',').filter(Boolean));
var rows=root.querySelectorAll('[data-tags]');
var chips=root.querySelector('.chosen');
function toggle(t){chosen.has(t)?chosen.delete(t):chosen.add(t);draw();}
function draw(){
var shown=0;
rows.forEach(function(r){var tags=r.dataset.tags.split('|');var ok=Array.from(chosen).every(function(t){return tags.indexOf(t)>-1;});r.hidden=!ok;if(ok)shown++;
r.querySelectorAll('.tg').forEach(function(b){b.setAttribute('aria-pressed',chosen.has(b.dataset.tag)?'true':'false');});});
chips.innerHTML='';
chosen.forEach(function(t){var b=document.createElement('button');b.type='button';b.className='chip accent';b.setAttribute('aria-pressed','true');b.textContent=t+' ✕';b.onclick=function(){toggle(t);};chips.appendChild(b);});
root.querySelector('.count').textContent=chosen.size?shown+' of '+rows.length+(rows.length===1?' issue':' issues'):shown+(shown===1?' issue':' issues');
var none=root.querySelector('.no-match');if(none)none.style.display=shown?'none':'flex';
var rl=root.querySelector('.issue-cards');if(rl)rl.style.display=shown?'flex':'none';chips.style.display=chosen.size?'flex':'none';
root.querySelectorAll('.bb-col').forEach(function(c){var n=c.querySelectorAll('[data-tags]:not([hidden])').length;c.querySelector('.n').textContent=n;c.querySelector('.bb-none').style.display=n?'none':'block';});
}
root.querySelectorAll('.tg').forEach(function(b){b.onclick=function(){toggle(b.dataset.tag);};});
draw();
});
</script>
