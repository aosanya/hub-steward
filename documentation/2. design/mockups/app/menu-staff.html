:root{font-size:90%;--content:.9rem;--r-sm:.5rem;--r-md:.875rem;--r-pill:999px;--sans:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;--bg:#EDF0EC;--bg-alt:#E3E8E3;--surface:#FBFCFA;--ink:#1B2430;--ink-soft:#3D4652;--line:rgba(27,36,48,.16);--line-strong:rgba(27,36,48,.4);--accent:#703C0F;--accent-strong:#542E0B;--accent-wash:rgba(112,60,15,.1);--on-accent:#FFFCF9;--danger:#A8402E;--success:#3F7D45;--info:#35618F;--info-wash:rgba(53,97,143,.1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-alt);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.5}
h1,h2,h3,p,figure,dl,dd,ul{margin:0}
ul{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;text-align:inherit}
.ic{flex:none;width:1.25rem;height:1.25rem;stroke-width:1.75}
.code{font-family:var(--mono);font-size:.75rem;color:var(--ink-soft);overflow-wrap:anywhere}
.screens{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(27rem,100%),27rem));justify-content:center;gap:2.5rem 2rem;padding:2rem 1rem 3rem}
figure{display:flex;flex-direction:column;gap:.75rem;min-width:0;max-width:100%}
.cap{width:0;min-width:100%;max-width:50rem;font-size:.8125rem;line-height:1.4;color:var(--ink-soft)}
.cap-rows{display:grid;grid-template-columns:6.5rem 1fr;gap:.375rem .75rem}
.cap-row{display:contents}
.cap-rows dt{font-weight:600;color:var(--ink)}
.cap-rows dd{margin:0;min-width:0;overflow-wrap:anywhere}
.phone{font-size:.8125rem;position:relative;display:flex;flex-direction:column;flex:none;width:27rem;max-width:100%;min-height:50rem;overflow:hidden;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 .5rem 1.5rem var(--line)}
.bar{position:sticky;top:0;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:.5rem;min-height:3rem;padding:0 .5rem;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-title{grid-column:2;max-width:14rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1.125rem;font-weight:700;line-height:1.2;text-align:center}
.back{display:inline-flex;align-items:center;gap:.125rem;min-height:3rem;padding:0 .5rem;border:0;background:transparent;color:var(--accent);white-space:nowrap}
.body{flex:1;display:flex;flex-direction:column;gap:.75rem;padding:1rem}
.line{font-size:.8125rem;color:var(--ink-soft)}
.rows{display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 1px 2px var(--line)}
.row{display:flex;align-items:center;gap:.75rem;min-height:3.5rem;padding:.5rem 1rem;color:var(--ink)}
.row+.row{border-top:1px solid var(--line)}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:.125rem}
.row .ttl{font-weight:600;overflow-wrap:anywhere}
.row .end{flex:none;color:var(--ink-soft)}
.state{scroll-margin-top:3.5rem;margin:0 auto;padding:2rem 1rem 0;max-width:72rem;font-size:1.5rem;font-weight:700;letter-spacing:-.015em}
.intro{margin:.5rem auto 0;padding:0 1rem;max-width:72rem;color:var(--ink-soft);font-size:.875rem}

<p class="intro">The screens behind the Staff &amp; Departments section of a town council: the staff of the municipality, one person to a row.</p>
<h2 class="state" id="staff">Staff</h2><main class="screens"><figure id="fig-staff"><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>what the Staff submenu of Staff &amp; Departments opens: the municipality's staff as a list, each row one person with name, role and department; tapping a row opens that person (the person screen is not drawn here). Back reads Staff &amp; Departments. The wide window is drawn below.</dd></div><div class="cap-row"><dt>Filled by</dt><dd><span class="code">actor_list_actors</span> (names)<br><span class="code">actor_list_role_assignments_for_group</span> (roles)<br>No tool in the hub lists a person's department, so the department on each row is drawn from the group the role is assigned in only if the role assignment names it; otherwise the field is left out.</dd></div><div class="cap-row"><dt>Example data</dt><dd>The names, roles and departments are invented sample data, not read from a hub.</dd></div></dl></figcaption><div class="phone"><header class="bar"><a class="back"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Staff &amp; Departments</a><span class="bar-title">Staff</span></header><div class="body"><div class="rows">
<a class="row"><span class="txt"><span class="ttl">Anna Sample</span><span class="line">Clerk · Registry</span></span><span class="end"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span></a>
<a class="row"><span class="txt"><span class="ttl">Ben Sample</span><span class="line">Planner · Planning</span></span><span class="end"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span></a>
<a class="row"><span class="txt"><span class="ttl">Csilla Sample</span><span class="line">Engineer · Public Works</span></span><span class="end"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span></a>
<a class="row"><span class="txt"><span class="ttl">Dani Sample</span><span class="line">Accountant · Finance</span></span><span class="end"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span></a>

</div></div><nav class="tabs" data-tabs data-chosen="home"></nav></div></figure></main>
<h2 class="state" id="staff-record">A staff member</h2><main class="screens"><figure id="mun898"><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>what a row of the Staff list opens: the record of one staff member, read only. Back reads Staff, the list it came from. The one thing a person does here is read the record; nothing on it is a button. The wide drawing of the same screen is further down this page.</dd></div><div class="cap-row"><dt>Filled by</dt><dd><span class="code">actor_get_actor</span> (name)<br><span class="code">actor_list_role_assignments_for_actor</span> (the role, one row for each seat)<br><span class="code">actor_get_actor_standing</span> (standing: each seat with its role name, its group name and how it ended; the department is the group name of the seat, and Standing reads In post when the seat has not ended). No tool supplies a job title or a contact detail, so none is drawn.</dd></div><div class="cap-row"><dt>Example data</dt><dd>Anna Sample, Clerk, Registry and In post are invented sample data, not read from a hub.</dd></div></dl></figcaption><div class="phone"><header class="bar"><a class="back"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Staff</a><span class="bar-title">Anna Sample</span></header><div class="body"><h3 class="dh">Anna Sample</h3><div class="rows">
<div class="row"><span class="txt"><span class="line">Role</span><span class="ttl">Clerk</span></span></div>
<div class="row"><span class="txt"><span class="line">Department</span><span class="ttl">Registry</span></span></div>
<div class="row"><span class="txt"><span class="line">Standing</span><span class="chip success">In post</span></span></div>
</div></div><nav class="tabs" data-tabs data-chosen="home"></nav></div></figure></main><main class="wide-screens"><figure id="fig-staff-wide"><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>what the Staff submenu of Staff &amp; Departments opens: the municipality's staff as a list, each row one person; tapping a row opens that person (the person screen is not drawn here). This is the wide window. Back reads Staff &amp; Departments.</dd></div><div class="cap-row"><dt>Filled by</dt><dd><span class="code">actor_list_actors</span> (names)<br><span class="code">actor_list_role_assignments_for_group</span> (roles)<br>No tool in the hub lists a person's department, so the department on each row is drawn from the group the role is assigned in only if the role assignment names it; otherwise the field is left out.</dd></div><div class="cap-row"><dt>Example data</dt><dd>The names, roles and departments are invented sample data, not read from a hub.</dd></div><div class="cap-row"><dt>Wide changes</dt><dd>In the wide window the list fills the window width less the margin, and each row puts the name on the left and the role and the department as two columns at the right of the row on one line, instead of under the name as on the phone. Nothing else changes and there is no new action.</dd></div></dl></figcaption><div class="pair"><div class="win w-wide"><header class="bar"><a class="back"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Staff &amp; Departments</a><span class="bar-title">Staff</span></header><div class="body"><div class="rows fluid-rows">

<a class="row"><span class="txt"><span class="ttl">Ben Sample</span></span><span class="meta"><span class="chip">Planner</span><span class="chip">Planning</span></span><span class="end"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span></a>

<a class="row"><span class="txt"><span class="ttl">Dani Sample</span></span><span class="meta"><span class="chip">Accountant</span><span class="chip">Finance</span></span><span class="end"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span></a>
<a class="row"><span class="txt"><span class="ttl">Eszter Sample</span></span><span class="meta"><span class="chip">Caretaker</span><span class="chip">Facilities</span></span><span class="end"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span></a>
<a class="row"><span class="txt"><span class="ttl">Ferenc Sample</span></span><span class="meta"><span class="chip">Records officer</span><span class="chip">Registry</span></span><span class="end"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span></a>
</div></div><nav class="tabs" data-tabs data-chosen="home"></nav></div></div></figure></main><main class="wide-screens"><figure id="mun898-wide"><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>the same screen as the phone figure above (id mun898): what a row of the Staff list opens, the record of one staff member, read only; Back reads Staff. This is the wide window.</dd></div><div class="cap-row"><dt>Filled by</dt><dd><span class="code">actor_get_actor</span> (name)<br><span class="code">actor_list_role_assignments_for_actor</span> (the role, one row for each seat)<br><span class="code">actor_get_actor_standing</span> (standing: each seat with its role name, its group name and how it ended; the department is the group name of the seat, and Standing reads In post when the seat has not ended). No tool supplies a job title or a contact detail, so none is drawn.</dd></div><div class="cap-row"><dt>Example data</dt><dd>Anna Sample, Clerk, Registry and In post are invented sample data, not read from a hub.</dd></div><div class="cap-row"><dt>Wide changes</dt><dd>the record keeps a readable width, never more than 70 characters, instead of the whole window; the name stays as the heading and each field puts its label at the left and its value at the right of the row on one line instead of the value under the label as on the phone. The same three fields, no new action, nothing else added.</dd></div></dl></figcaption><div class="pair"><div class="win w-wide"><header class="bar"><a class="back"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Staff</a><span class="bar-title">Anna Sample</span></header><div class="body"><div class="read"><h3 class="dh">Anna Sample</h3><div class="rows fluid-rows">

</div></div></div><nav class="tabs" data-tabs data-chosen="home"></nav></div></div></figure></main>

<a class="row"><span class="txt"><span class="ttl">Sample Finance</span><span class="line">5 people</span></span><span class="end"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span></a>
