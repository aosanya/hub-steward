<h2 class="state" id="s1">1 · Choosing the priority</h2><main class="screens"><figure><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>the issue page. The card's header holds only the code; under it come the title and the chip row, and in the chip row a button names the issue's priority, Priority: Medium, beside the Effort button and the tags. The description is the card's body, and the card has no row of buttons under it. Every screen that shows an issue uses this one card shape (decision 139).</dd></div><div class="cap-row"><dt>Opened</dt><dd>tapping the button opens the four values, Critical, High, Medium and Low. Tapping one closes the list and writes it at once; there is no Save.</dd></div><div class="cap-row"><dt>Filled by</dt><dd><span class="code">taskmanager_task_read</span><br><span class="code">taskmanager_task_patch</span> (priority)</dd></div><div class="cap-row"><dt>Example data</dt><dd>The issues, titles and counts are drawn for this page, not read from the hub.</dd></div></dl></figcaption><div class="phone"><header class="bar" data-back="All issues" data-title="HS-002" data-agency="Hub Steward SWE"></header><div class="body"><div class="issue-wide"><div class="issue-main"><section class="card"><div class="card-head"><span class="card-title"><span class="issue-code">HS-002</span></span></div><div class="card-body"><span class="issue-title full">Import the Siaya agency</span><span class="issue-tags"><span class="chip success">Ready</span><span class="chip hued" style="--hue:207;--shade:2">hub-steward</span><span class="chip hued" style="--hue:284;--shade:4">Backlog</span><span class="chip">Backlog · To do</span><div class="actions"><button type="button" class="actions-btn" aria-expanded="true">Priority: Medium<span aria-hidden="true">▾</span></button><div class="actions-list"><button type="button">Critical</button><button type="button">High</button><button type="button">Medium</button><button type="button">Low</button></div></div><div class="actions"><button type="button" class="actions-btn" aria-expanded="false">Effort: Unknown<span aria-hidden="true">▾</span></button></div></span><div class="issue-body"><p>Load the English template into the local database and check that <strong>all 46 workflows</strong> are listed.</p></div></div></section></div><div class="issue-side"></div></div></div><nav class="tabs" data-tabs data-chosen="" data-badge="3"></nav></div></figure></main><h2 class="state" id="s2">2 · After choosing critical</h2><main class="screens"><figure><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>the issue page after the owner picked critical. The button reads critical and the Log under the card has one more entry written by the hub, Priority medium to critical. If the hub refuses (the person cannot move issues) the page says The priority was not changed and the button keeps the old value.</dd></div><div class="cap-row"><dt>Who</dt><dd>a person with Can move on the backlog the issue is in; a person without it sees the priority as a tag and no button.</dd></div><div class="cap-row"><dt>Filled by</dt><dd><span class="code">taskmanager_task_read</span><br><span class="code">taskmanager_task_patch</span> (priority)</dd></div><div class="cap-row"><dt>Example data</dt><dd>The issues, titles and counts are drawn for this page, not read from the hub.</dd></div></dl></figcaption><div class="phone"><header class="bar" data-back="All issues" data-title="HS-002" data-agency="Hub Steward SWE"></header><div class="body"><div class="issue-wide"><div class="issue-main"><section class="card"><div class="card-head"><span class="card-title"><span class="issue-code">HS-002</span></span></div><div class="card-body"><span class="issue-title full">Import the Siaya agency</span><span class="issue-tags"><span class="chip success">Ready</span><span class="chip hued" style="--hue:207;--shade:2">hub-steward</span><span class="chip hued" style="--hue:284;--shade:4">Backlog</span><span class="chip">Backlog · To do</span><div class="actions"><button type="button" class="actions-btn" aria-expanded="false">Priority: Critical<span aria-hidden="true">▾</span></button></div><div class="actions"><button type="button" class="actions-btn" aria-expanded="false">Effort: Unknown<span aria-hidden="true">▾</span></button></div></span><div class="issue-body"><p>Load the English template into the local database and check that <strong>all 46 workflows</strong> are listed.</p></div></div></section></div><div class="issue-side"><section class="card flush"><div class="card-head"><button type="button" class="card-toggle" aria-expanded="true"><span class="card-title">Log</span><span class="card-chevron" aria-hidden="true">⌄</span></button></div><div class="card-body"><div class="log-entry"><div class="log-by"><b>Owner</b><span class="chip">Person</span><span>11 Nov, 19:10</span></div><p>Priority medium to critical</p></div></div></section></div></div></div><nav class="tabs" data-tabs data-chosen="" data-badge="3"></nav></div></figure></main><h2 class="state" id="s3">3 · The board after the change</h2><main class="screens"><figure><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>the Backlog board's To do column after HS-002 was raised to critical: it is at the top of the column, above the high and medium cards, and every card shows its priority in its chip row. Raising an issue puts it at the top of its new priority group in the step it is in, so a second critical issue goes above the first. Lowering puts it at the top of the lower group.</dd></div><div class="cap-row"><dt>On a card</dt><dd>the priority is the same button as on the issue page, Priority: Critical, beside the Effort button; tapping it opens the four values. A card in the Done step shows it as a plain chip, not a button.</dd></div><div class="cap-row"><dt>Filled by</dt><dd><span class="code">taskmanager_task_read</span><br><span class="code">
