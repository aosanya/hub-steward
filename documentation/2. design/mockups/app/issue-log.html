<p class="intro">The Log on an issue's page: a running list of dated notes that records what was done, so work that was cut off can be resumed and a person can see what was done and what was tried. Built in the app (journey 03 step 8).</p>
<h2 class="state" id="s1">1 · A Log with notes</h2><main class="screens"><figure><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>the issue page of a tapped row, with a Log section under the description: dated entries, oldest first, the newest last. Each entry shows who wrote it, a worker or a person, and when. An entry is a line or a longer write-up, and can carry links to the work: a commit, a file, a CI run. A worker adds an entry at each step it finishes; a person, such as the owner reviewing a In Progress or Done issue or about to pick one, reads it to see what was done and what was tried, and can add a note from the box at the bottom, for example a review comment. The box is there for anyone who can see the issue, a read-only Backlog member included. Nothing is overwritten or removed. The issue row on the lists and the board shows nothing new.</dd></div><div class="cap-row"><dt>Filled by</dt><dd><span class="code">taskmanager_task_note_list</span><br><span class="code">taskmanager_task_note_add</span></dd></div><div class="cap-row"><dt>Example data</dt><dd>The issue, the notes, the names, the commit and the times are drawn for this page, not read from the hub.</dd></div></dl></figcaption><div class="phone"><header class="bar"><a class="back"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>All issues</a><span class="bar-title">HS-002</span><span class="bar-action"><button type="button" class="menu-btn" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg></button></span></header><div class="body"><div class="card flush"><div class="row"><span class="txt"><span class="ttl itl"><span class="icode">HS-002</span> Import the municipality</span><span
