<p class="intro">The Log on an issue's page: a running list of dated notes that records what was done, so work that was cut off can be resumed and a person can see what was done and what was tried. Built in the app (journey 03 step 8).</p>
<h2 class="state" id="s1">1 · A Log with notes</h2><main class="screens"><figure><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>the issue page of a tapped row, with a Log section under the description: dated entries, oldest first, the newest last. Each entry shows who wrote it, a worker or a person, and when. An entry is a line or a longer write-up, and can carry links to the work: a commit, a file, a CI run. A worker adds an entry at each step it finishes; a person, such as the owner reviewing a In Progress or Done issue or about to pick one, reads it to see what was done and what was tried, and can add a note from the box at the bottom, for example a review comment. The box is there for anyone who can see the issue, a read-only Backlog member included. Nothing is overwritten or removed. The issue row on the lists and the board shows nothing new.</dd></div><div class="cap-row"><dt>Filled by</dt><dd><span class="code">taskmanager_task_note_list</span><br><span class="code">taskmanager_task_note_add</span></dd></div><div class="cap-row"><dt>Example data</dt><dd>The issue, the notes, the names, the commit and the times are drawn for this page, not read from the hub.</dd></div></dl></figcaption><div class="phone"><header class="bar" data-back="All issues" data-title="HS-002" data-agency="Hub Steward SWE"></header><div class="body"><div class="issue-wide"><div class="issue-main"><section class="card"><div class="card-head"><span class="card-title"><span class="issue-code">HS-002</span></span></div><div class="card-body"><span class="issue-title full">Import the Siaya agency</span><span class="issue-tags"><span class="chip danger">Blocked</span><span class="chip hued" style="--hue:207;--shade:2">hub-steward</span><span class="chip hued" style="--hue:249;--shade:4">Docs</span><span class="chip hued" style="--hue:284;--shade:4">Backlog</span><span class="chip">Backlog · Testing</span><div class="actions"><button type="button" class="actions-btn" aria-expanded="false">Priority: Critical<span aria-hidden="true">▾</span></button></div><div class="actions"><button type="button" class="actions-btn" aria-expanded="false">Effort: Unknown<span aria-hidden="true">▾</span></button></div></span><div class="issue-body"><p>Load the English template into the local database and check that <strong>all 46 workflows</strong> are listed, with <code>tier*</code> and the role tables.</p><ul><li>Run the importer</li><li>Check the count</li></ul></div></div></section></div><div class="issue-side"><section class="card flush"><div class="card-head"><button type="button" class="card-toggle" aria-expanded="true"><span class="card-title">Log</span><span class="card-chevron" aria-hidden="true">⌄</span></button></div><div class="card-body"><div class="log-entry"><div class="log-by"><b>Backlog worker</b><span class="chip info">Worker</span><span>10 Nov, 14:02</span></div><p>Took the issue and moved it to In Progress.</p></div><div class="log-entry"><div class="log-by"><b>Backlog worker</b><span class="chip info">Worker</span><span>10 Nov, 14:20</span></div><p>Failing test written: the importer lists 45 of 46 workflows.</p><div class="log-links"><span class="log-link">loader/importer_test.go</span></div></div><div class="log-entry"><div class="log-by"><b>Backlog worker</b><span class="chip info">Worker</span><span>10 Nov, 15:05</span></div><p>Fixed the importer. It stopped at the first workflow without a role table and dropped the ones after it; it now reads every workflow and lists the missing role tables in the report.</p><p>Changed the importer and its report, and added a test for a workflow with no role table. The count is 46 of 46 on the memory backend and the loader tests pass.</p><p>Left to do: the same check for the Dutch template, which has not been run.</p><div class="log-links"><span class="log-link">commit 3f9a1c2</span><span class="log-link">loader/importer.go</span><span class="log-link">CI run 481: passed</span>
