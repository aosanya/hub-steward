<p class="intro">Managing backlogs in the app itself, for roles that hold the permission (decision 59). The same changes can still be asked for in Chat. Drawn for the owner to change; no code behind it.</p>
<h2 class="state" id="s1">1 · Add and edit a backlog</h2><main class="screens"><figure><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>the Backlogs list, reached by tapping Backlogs on Home, as a person who may manage backlogs sees it: the same rows, and an Add a backlog button under them. Shown only to a person whose role holds the permission to manage backlogs (decision 59); everyone else sees the read-only page.</dd></div><div class="cap-row"><dt>Filled by</dt><dd><span class="code">list_task_states</span><br><span class="code">backlog tools (SW20)</span></dd></div><div class="cap-row"><dt>Example data</dt><dd>The issue titles, repos, counts and times are drawn for this page, not read from the boards. This is the Hub Steward SWE agency; its roles are the Product owner and the Triager (decisions 45 and 49). The group names are drawn for this page.</dd></div></dl></figcaption><div class="phone"><header class="bar" data-title="Backlogs" data-agency="Hub Steward SWE"></header><div class="body"><div class="rows"><a class="row" href="lists.html"><span class="txt"><span class="ttl">All issues</span><span class="meta">8 issues</span><span class="step-counts"><span class="chip">To do: 3</span><span class="chip">Done: 2</span><span class="chip">In Progress: 1</span><span class="chip">Review: 1</span><span class="chip">Writing: 1</span></span></span><span class="end" aria-hidden="true">›</span></a><a class="row" href="kanban.html#t-software"><span class="txt"><span class="ttl">Software</span><span class="meta">6 steps · 5 issues</span><span class="step-counts"><span class="chip">To do: 2</span><span class="chip">In Progress: 1</span><span class="chip">Review: 1</span><span class="chip">Done: 1</span></span></span><span class="end" aria-hidden="true">›</span></a><a class="row" href="kanban.html#t-documentation"><span class="txt"><span class="ttl">Documentation</span><span class="meta">5 steps · 3 issues</span><span class="step-counts"><span class="chip">To do: 1</span><span class="chip">Writing: 1</span><span class="chip">Done: 1</span></span></span><span class="end" aria-hidden="true">›</span></a></div><button type="button" class="btn quiet">Add a backlog</button></div><nav class="tabs" data-tabs data-chosen="" data-badge="3"></nav></div></figure><figure><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>adding a backlog. A name and its steps in order; each step can be moved up or down or removed before the backlog is created. There is no limit on the number of backlogs or steps.</dd></div><div class="cap-row"><dt>Filled by</dt><dd><span class="code">backlog tools (SW20)</span></dd></div><div class="cap-row"><dt>Example data</dt><dd>The issue titles, repos, counts and times are drawn for this page, not read from the boards. This is the Hub Steward SWE agency; its roles are the Product owner and the Triager (decisions 45 and 49). The group names are drawn for this page.</dd></div></dl></figcaption><div class="phone"><header class="bar" data-back="" data-agency="Hub Steward SWE"></header><div class="body"><div class="head"><h1 class="headline">Add a backlog</h1></div><div class="field"><label class="flabel">Name</label><div class="input"><input type="text" value="Support" readonly></div></div><div class="field"><span class="flabel">Steps, in order</span><div class="rows"><div class="row"><span class="txt"><span class="ttl">New</span></span><span class="end"><span class="icbs"><button type="button" class="icb" aria-label="Rename New">✎</button><button type="button" class="icb" aria-label="Move New up" disabled>↑</button><button type="button" class="icb" aria-label="Move New down">↓</button><button type="button" class="icb" aria-label="Remove New">×</button></span></span></div><div class="row"><span class="txt"><span class="ttl">Answering</span></span><span class="end"><span class="icbs"><button type="button" class="icb" aria-label="Rename Answering">✎</button><button type="button" class="icb" aria-label="Move Answering up">↑</button><button type="button" class="icb" aria-label="Move Answering down">↓</button><button type="button" class="icb" aria-label="Remove Answering">×</button></span></span></div><div class="row"><span class="txt"><span class="ttl">Closed</span></span><span class="end"><span class="icbs"><button type="button" class="icb" aria-label="Rename Closed">✎</button><button type="button" class="icb" aria-label="Move Closed up">↑</button><button type="button" class="icb" aria-label="Move Closed down" disabled>↓</button><button type="button" class="icb" aria-label="Remove Closed">×</button></span></span></div></div><div class="field"><label class="flabel">New step</label><div class="input"><input type="text" readonly></div></div><button type="button" class="btn quiet" disabled>Add a step</button></div><p class="sub">A new backlog is seen only by the Product owner group until you give another group access.</p><button type="button" class="btn primary">Create the backlog</button></div><nav class="tabs" data-tabs data-chosen="" data-badge="3"></nav></div></figure><figure><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>editing a backlog: rename it, move its steps up or down, add a step, remove an empty step. A step holding issues has its remove button off and says how many it holds (decision 25).</dd></div><div class="cap-row"><dt>Filled by</dt><dd><span class="code">backlog tools (SW20)</span></dd></div><div class="cap-row"><dt>Example data</dt><dd>The issue titles, repos, counts and times are drawn for this page, not read from the boards. This is the Hub Steward SWE agency; its roles are the Product owner and the Triager (decisions 45 and 49). The group names are drawn for this page.</dd></div></dl></figcaption><div class="phone"><header class="bar" data-back="" data-agency="Hub Steward SWE"></header><div class="body"><div class="head"><h1 class="headline">Edit Software</h1></div><div class="field"><label class="flabel">Name</label><div class="input"><input type="text" value="Software" readonly></div></div><div class="field"><span class="flabel">Steps, in order</span><div class="rows"><div class="row"><span class="txt"><span class="ttl">To do</span><span class="meta">5 issues</span></span><span class="end"><span class="icbs"><button type="button" class="icb" aria-label="Rename To do">✎</button><button type="button" class="icb" aria-label="Move To do up" disabled>↑</button><button type="button" class="icb" aria-label="Move To do down">↓</button><button type="button" class="icb" aria-label="Remove To do" disabled>×</button></span></span></div><div class="row"><span class="txt"><span class="ttl">In Progress</span><span class="meta">1 issue</span></span><span class="end"><span class="icbs"><button type="button" class="icb" aria-label="Rename In Progress">✎</button><button type="button" class="icb" aria-label="Move In Progress up">↑</button><button type="button" class="icb" aria-label="Move In Progress down">↓</button><button type="button" class="icb" aria-label="Remove In Progress" disabled>×</button></span></span></div><div class="row"><span class="txt"><span class="ttl">Review</span><span class="meta">No issues</span></span><span class="end"><span class="icbs"><button type="button" class="icb" aria-label="Rename Review">✎</button><button type="button" class="icb" aria-label="Move Review up">↑</button><button type="button" class="icb" aria-label="Move Review down">↓</button><button type="button" class="icb" aria-label="Remove Review">×</button></span></span></div><div class="row"><span class="txt"><span class="ttl">Testing</span><span class="meta">1 issue</span></span><span class="end"><span class="icbs"><button type="button" class="icb" aria-label="Rename Testing">✎</button><button type="button" class="icb" aria-label="Move Testing up">↑</button><button type="button" class="icb" aria-label="Move Testing down">↓</button><button type="button" class="icb" aria-label="Remove Testing" disabled>×</button></span></span></div><div class="row"><span class="txt"><span class="ttl">Done</span><span class="meta">No issues</span></span><span class="end"><span class="icbs"><button type="button" class="icb" aria-label="Rename Done">✎</button><button type="button" class="icb" aria-label="Move Done up">↑</button><button type="button" class="icb" aria-label="Move Done down">↓</button><button type="button" class="icb" aria-label="Remove Done">×</button></span></span></div><div class="row"><span class="txt"><span class="ttl">Cancelled</span><span class="meta">No issues</span></span><span class="end"><span class="icbs"><button type="button" class="icb" aria-label="Rename Cancelled">✎</button><button type="button" class="icb" aria-label="Move Cancelled up">↑</button><button type="button" class="icb" aria-label="Move Cancelled down" disabled>↓</button><button type="button" class="icb" aria-label="Remove Cancelled">×</button></span></span></div></div><div class="field"><label class="flabel">New step</label><div class="input"><input type="text" readonly></div></div><button type="button" class="btn quiet" disabled>Add a step</button></div><button type="button" class="btn primary">Save</button><button type="button" class="btn quiet">Archive the backlog</button><button type="button" class="btn danger" disabled>Delete the backlog</button><p class="sub">It still holds 7 issues.</p><p class="sub">A step that holds issues cannot be removed, and a backlog that holds issues cannot be deleted. An archived backlog leaves the Backlogs list; its issues stay.</p></div><nav class="tabs" data-tabs data-chosen="" data-badge="3"></nav></div></figure><figure><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>what a refused removal looks like if it is tried anyway, for example from a screen opened before the issues were moved in. The backlog is unchanged.</dd></div><div class="cap-row"><dt>Filled by</dt><dd><span class="code">backlog tools (SW20)</span></dd></div><div class="cap-row"><dt>Example data</dt><dd>The issue titles, repos, counts and times are drawn for this page, not read from the boards. This is the Hub Steward SWE agency; its roles are the Product owner and the Triager (decisions 45 and 49). The group names are drawn for this page.</dd></div></dl></figcaption><div class="phone"><header class="bar" data-back="" data-agency="Hub Steward SWE"></header><div class="body"><div class="head"><h1 class="headline">Edit Software</h1></div><div class="field"><label class="flabel">Name</label><div class="input"><input type="text" value="Software" readonly></div></div><div class="field"><span class="flabel">Steps, in order</span><div class="rows"><div class="row"><span class="txt"><span class="ttl">To do</span><span class="meta">5 issues</span></span><span class="end"><span class="icbs"><button type="button" class="icb" aria-label="Rename To do">✎</button><button type="button" class="icb" aria-label="Move To do up" disabled>↑</button><button type="button" class="icb" aria-label="Move To do down">↓</button><button type="button" class="icb" aria-label="Remove To do" disabled>×</button></span></span></div><div class="row"><span class="txt"><span class="ttl">In Progress</span><span class="meta">1 issue</span></span><span class="end"><span class="icbs"><button type="button" class="icb" aria-label="Rename In Progress">✎</button><button type="button" class="icb" aria-label="Move In Progress up">↑</button><button type="button" class="icb" aria-label="Move In Progress down">↓</button><button type="button" class="icb" aria-label="Remove In Progress" disabled>×</button></span></span></div><div class="row"><span class="txt"><span class="ttl">Review</span><span class="meta">No issues</span></span><span class="end"><span class="icbs"><button type="button" class="icb" aria-label="Rename Review">✎</button><button type="button" class="icb" aria-label="Move Review up">↑</button><button type="button" class="icb" aria-label="Move Review down">↓</button><button type="button" class="icb" aria-label="Remove Review">×</button></span></span></div><div class="row"><span class="txt"><span class="ttl">Testing</span><span class="meta">1 issue</span></span><span class="end"><span class="icbs"><button type="button" class="icb" aria-label="Rename Testing">✎</button><button type="button" class="icb" aria-label="Move Testing up">↑</button><button type="button" class="icb" aria-label="Move Testing down">↓</button><button type="button" class="icb" aria-label="Remove Testing" disabled>×</button></span></span></div><div class="row"><span class="txt"><span class="ttl">Done</span><span class="meta">No issues</span></span><span class="end"><span class="icbs"><button type="button" class="icb" aria-label="Rename Done">✎</button><button type="button" class="icb" aria-label="Move Done up">↑</button><button type="button" class="icb" aria-label="Move Done down">↓</button><button type="button" class="icb" aria-label="Remove Done">×</button></span></span></div><div class="row"><span class="txt"><span class="ttl">Cancelled</span><span class="meta">No issues</span></span><span class="end"><span class="icbs"><button type="button" class="icb" aria-label="Rename Cancelled">✎</button><button type="button" class="icb" aria-label="Move Cancelled up">↑</button><button type="button" class="icb" aria-label="Move Cancelled down" disabled>↓</button><button type="button" class="icb" aria-label="Remove Cancelled">×</button></span></span></div></div><div class="field"><label class="flabel">New step</label><div class="input"><input type="text" readonly></div></div><button type="button" class="btn quiet" disabled>Add a step</button></div><p class="ferr" role="alert">To do still holds 5 issues. Move them first, in Chat or on the board.</p><button type="button" class="btn primary">Save</button><button type="button" class="btn quiet">Archive the backlog</button><button type="button" class="btn danger" disabled>Delete the backlog</button><p class="sub">It still holds 7 issues.</p><p class="sub">A step that holds issues cannot be removed, and a backlog that holds issues cannot be deleted. An archived backlog leaves the Backlogs list; its issues stay.</p></div><nav class="tabs" data-tabs data-chosen="" data-badge="3"></nav></div></figure></main><h2 class="state" id="s2">2 · Access</h2><main class="screens"><figure><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>the backlog page as a manager sees it: an Edit this backlog button above the steps opens the edit screen, and a Change who has access button under the access list opens the access screen. A person without the permission sees neither button.</dd></div><div class="cap-row"><dt>Filled by</dt><dd><span class="code">list_task_states</span><br><span class="code">backlog access (SW32)</span></dd></div><div class="cap-row"><dt>Example data</dt><dd>The issue titles, repos, counts and times are drawn for this page, not read from the boards. This is the Hub Steward SWE agency; its roles are the Product owner and the Triager (decisions 45 and 49). The group names are drawn for this page.</dd></div></dl></figcaption><div class="phone"><header class="bar" data-back="List" data-title="Software" data-agency="Hub Steward SWE"></header><div class="body"><div class="head"><p class="sub">Backlog · 6 steps</p></div><button type="button" class="btn quiet">Edit this backlog</button><h2 class="heading">Steps, in order</h2><div class="rows"><div class="row"><span class="txt"><span class="ttl">To do</span></span><span class="end">3 issues</span></div><div class="row"><span class="txt"><span class="ttl">In Progress</span></span><span class="end">1 issue</span></div><div class="row"><span class="txt"><span class="ttl">Review</span></span><span class="end">0 issues</span></div><div class="row"><span class="txt"><span class="ttl">Testing</span></span><span class="end">1 issue</span></div><div class="row"><span class="txt"><span class="ttl">Done</span></span><span class="end">0 issues</span></div><div class="row"><span class="txt"><span class="ttl">Cancelled</span></span><span class="end">0 issues</span></div></div><h2 class="heading">Who has access</h2><div class="rows"><div class="row"><span class="txt"><span class="ttl">Product owner</span></span><span class="end"><span class="chip accent">Can edit</span></span></div><div class="row"><span class="txt"><span class="ttl">Core team</span></span><span class="end"><span class="chip accent">Can move</span></span></div><div class="row"><span class="txt"><span class="ttl">Contributors</span></span><span class="end"><span class="chip">Can see</span></span></div></div><button type="button" class="btn quiet">Change who has access</button><p class="sub">A group that can edit can also move and see.</p></div><nav class="tabs" data-tabs data-chosen="" data-badge="3"></nav></div></figure><figure><figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>who has access to a backlog: each group with one of Can see, Can move or Can edit; Can edit is what Edit this backlog needs (rename, steps, access, delete), and includes Can move. A group with no access is not listed, so there is no No access segment; the cross on a group takes its access away. Add a group lists the groups of the agency that have none yet. The change is saved when a level is chosen. Proposed, see Q21.</dd></div><div class="cap-row"><dt>Filled by</dt><dd><span class="code">backlog access (SW32)</span></dd></div><div class="cap-row"><dt>Example data</dt><dd>The issue titles, repos, counts and times are drawn for this page, not read from the boards. This is the Hub Steward SWE agency; its roles are the Product owner and the Triager (decisions 45 and 49). The group names are drawn for this page.</dd></div></dl></figcaption><div class="phone"><header class="bar" data-back="" data-agency="Hub Steward SWE"></header><div class="body"><div class="head"><h1 class="headline">Access to Software</h1><p class="sub">Backlog</p></div><section class="card"><div class="card-head"><span class="card-title">Product owner</span></div><div class="card-body"><span class="chip accent">Can edit</span></div></section><section class="card"><div class="card-head"><span class="card-title">Core team</span><button type="button" class="icb" aria-label="Take away access from Core team">×</button></div><div class="card-body"><div class="seg" role="group" aria-label="Access for Core team"><button type="button" aria-pressed="false">Can see</button><button type="button" aria-pressed="true">Can move</button><button type="button" aria-pressed="false">Can edit</button></div><p class="sub">Uses the Backlogs as: no role yet</p></div></section><section class="card"><div class="card-head"><span class="card-title">Contributors</span><button type="button" class="icb" aria-label="Take away access from Contributors">×</button></div><div class="card-body"><div class="seg" role="group" aria-label="Access for Contributors"><button type="button" aria-pressed="true">Can see</button><button type="button" aria-pressed="false">Can move</button><button type="button" aria-pressed="false">Can edit</button></div><p class="sub">Uses the Backlogs as: no role yet</p></div></section><button type="button" class="btn quiet">Add a group</button><p class="sub">Access is given to groups, to the whole backlog. The Product owner group always has Can edit. A group that can edit can also move and see.</p></div><nav class="tabs" data-tabs data-chosen="" data-badge="3"></nav></div></figure></main>
