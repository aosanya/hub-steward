<figcaption class="cap"><dl class="cap-rows"><div class="cap-row"><dt>Landing</dt><dd>Do Something of the Siaya Farmers' Group, the Start segment. One list of tasks: Buy inputs, Sell harvest, Forms, Join a group and Apply as a supplier. Buy inputs and Sell harvest, the chat tasks, carry the small chat icon before the name; no other row has a mark. The list keeps a step after she begins it, since the API lists a step for as long as she holds its role; the app lists the steps she has begun again under Ongoing.</dd></div><div class="cap-row"><dt>Filled by</dt><dd><span class="code">agency_get_agency</span><br><span class="code">agency_list_modules</span><br><span class="code">agency_list_my_open_steps</span></dd></div></dl></figcaption>
