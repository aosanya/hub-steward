h1{font-weight:700;font-size:clamp(1.5rem,2.6vw,2rem);letter-spacing:-.02em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;box-sizing:border-box;padding:0 22px;border:1px solid transparent;border-radius:12px;font-size:.9375rem;font-weight:600;text-decoration:none;cursor:pointer}

.track{position:relative;width:40px;height:24px;flex:none;border-radius:999px;background:var(--line2)}
.track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--text)}
input:checked+.track{background:var(--accent)}
input:checked+.track::after{left:19px;background:var(--ink)}
input:disabled+.track{opacity:.45}
.toggle:has(input:disabled){cursor:default}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl-item{position:relative;display:flex;gap:14px;padding-bottom:20px}
.tl-item:last-child{padding-bottom:0}
.tl-item:not(:last-child)::before{content:"";position:absolute;left:9px;top:22px;bottom:2px;width:2px;background:var(--line)}
.tl-dot{width:20px;height:20px;flex:none;box-sizing:border-box;border-radius:50%;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.tl-item.done .tl-dot{background:var(--ok);border-color:var(--ok)}
.tl-item.now .tl-dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--sel)}
.tl-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.tl-title{font-size:.9375rem;font-weight:600}
.tl-item.next .tl-title{color:var(--text2);font-weight:500}
.tl-meta{font-size:.8125rem;color:var(--text3)}
.chat{flex:0 0 22rem;box-sizing:border-box;max-width:100%;display:flex;flex-direction:column;background:var(--side);border-left:1px solid var(--line)}
.chat.rail{flex:0 0 3.5rem;align-items:center;gap:16px;padding:14px 0}
.chat-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.chat-ctx{display:inline-flex;align-items:center;gap:8px;margin-left:auto;min-height:30px;padding:0 12px;border-radius:999px;background:var(--sel);box-shadow:inset 0 0 0 1px var(--line2);font-size:.8125rem;color:var(--text)}
.chat-ctx svg{flex:none;color:var(--accent)}
.chat-collapse{width:32px;height:32px;flex:none;border:0;border-radius:8px;background:transparent;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center}
.rail-ico{position:relative;display:flex;color:var(--accent)}
.rail-dot{position:absolute;top:-3px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--side)}
.thread{flex:1 1 auto;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column-reverse}
.thread-in{display:flex;flex-direction:column;gap:12px}
.chat-chips{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px 0}
.sugg{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border:1px solid var(--line2);border-radius:999px;background:var(--sel);color:var(--text2);font-size:.8125rem;cursor:pointer}
.sugg svg{color:var(--accent)}
.chat-input{padding:16px}
.composer{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line2);font-size:.9375rem}
.composer textarea{box-sizing:border-box;width:100%;min-height:5.5rem;padding:0;border:0;background:transparent;color:var(--text);outline:none;resize:none}
.composer-bar{display:flex;align-items:center;justify-content:space-between}
.chat-tools{display:flex;align-items:center;gap:4px;min-width:0}
.chat-model{position:relative;font-size:.8125rem}
.chat-model:empty{display:none}
.chat-model>button{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 10px;border:0;border-radius:999px;background:var(--chip);color:var(--text2);cursor:pointer}
.chat-model-list{position:absolute;left:0;bottom:calc(100% + 8px);z-index:2;box-sizing:border-box;min-width:12rem;width:max-content;max-width:calc(100vw - 2rem);margin:0;padding:6px;list-style:none;border:1px solid var(--line2);border-radius:12px;background:var(--card);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.chat-model-list li{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;padding:0 10px;white-space:nowrap;border-radius:8px;color:var(--text2);font-size:.875rem}
.chat-model-list li[aria-selected=true]{background:var(--sel);color:var(--text)}
.chat-model-list svg{color:var(--accent)}
.act-wrap{position:relative;display:inline-block}
.act-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:2;box-sizing:border-box;display:flex;flex-direction:column;min-width:9rem;padding:6px;border:1px solid var(--line2);border-radius:12px;background:var(--card);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.act-item{display:flex;align-items:center;min-height:2.25rem;padding:0 .625rem;border:0;border-radius:8px;background:none;color:var(--text2);font:inherit;font-size:.875rem;text-align:left;white-space:nowrap}
.act-item{text-decoration:none}
.act-item.bad{color:var(--bad)}
.table-card:has(.act-menu){overflow:visible}
.act-wrap:has(.act-menu){z-index:4}
.sc-head{display:flex;align-items:center;gap:12px}
.sc-head .cell{flex:1;min-width:0}
.sc-end{display:flex;align-items:center;gap:8px;flex:none}
.sc-head.sc-top{align-items:flex-start}
.sc-meta{margin:0;color:var(--text3);font-size:.875rem}
.chat-attach{width:40px;height:40px;flex:none;border:0;border-radius:50%;background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.chat-send{width:40px;height:40px;flex:none;border:0;border-radius:50%;background:var(--accent);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.msg{display:flex;gap:10px;font-size:.875rem}
.msg.user{align-self:flex-end;max-width:85%}
.bubble{padding:10px 14px;border-radius:14px 14px 4px 14px;background:var(--sel);border:1px solid var(--accent-line);color:var(--text)}
.msg.bot{align-items:flex-start;color:var(--text2);line-height:1.5}
.bot-badge{width:26px;height:26px;flex:none;border-radius:8px;background:var(--chip);color:var(--accent);display:flex;align-items:center;justify-content:center}
.bot-text{min-width:0;padding-top:3px}
.msg-card{box-sizing:border-box;max-width:40rem;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line2);display:flex;flex-direction:column;gap:10px;font-size:.875rem}
.msg-card.bad{border-color:var(--bad)}
.msg-card.wide{max-width:none}
.msg-title{display:flex;align-items:center;gap:8px;font-weight:600}
.msg-title svg{flex:none;color:var(--accent)}
.msg-title.ok svg{color:var(--ok)}
.msg-title.bad svg{color:var(--bad)}
.msg-detail{line-height:1.5;color:var(--text2)}
.msg-buttons{display:flex;flex-wrap:wrap;gap:8px}
.msg-note{font-size:.75rem;color:var(--text3)}
.msg-done{display:flex;align-items:center;gap:8px;color:var(--ok);font-weight:500}
.msg-form{display:flex;flex-direction:column;gap:12px}
.msg-card .control{min-height:40px;font-size:.875rem}
.msg-card .control input,.msg-card .control select{min-height:36px}
.ref-title{flex:1 1 auto;min-width:0}
.ref-go{display:flex;align-items:center;gap:6px}
.list-row{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 0;border-top:1px solid var(--line)}
.list-text{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.list-name{font-weight:600}
.list-meta{font-size:.8125rem;color:var(--text3)}
.mini{width:100%;border-collapse:collapse;font-size:.8125rem}
.mini th{padding:0 12px 8px 0;font-size:.6875rem;font-weight:400;letter-spacing:.08em;text-align:left;text-transform:uppercase;color:var(--text3)}
.mini td{padding:8px 12px 8px 0;border-top:1px solid var(--line);vertical-align:middle}
.tools{box-sizing:border-box;border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.tools-head{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border-bottom:1px solid var(--line);font-size:.8125rem;color:var(--text2)}
.tools.collapsed .tool{display:none}
.tools.collapsed .tools-head{border-bottom:0}
.tools.collapsed .tools-head svg{transform:rotate(-90deg)}
.tools .tool{border-bottom:1px solid var(--line)}
.tools .tool:last-child{border-bottom:0}
.thread-in>.tool{box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.tool{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:2px 8px;padding:6px 10px;font-size:.8125rem}
.tool-ico{display:flex;color:var(--text3)}
.tool-name{justify-self:start;padding:2px 8px;border-radius:6px;background:var(--chip);font-family:var(--mono);font-size:.75rem;color:var(--text);overflow-wrap:anywhere}
.tool-state{display:flex;color:var(--ok)}
.tool.error .tool-state{color:var(--bad)}
.tool-spin{width:12px;height:12px;box-sizing:border-box;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--accent)}
.tool-ms{min-width:3.5rem;font-family:var(--mono);font-size:.6875rem;text-align:right;color:var(--text4)}
.tool-sum{grid-column:2 / -1;min-width:0;overflow-wrap:anywhere;font-size:.75rem;color:var(--text3)}
.nav-div{display:flex;align-items:center;gap:12px;color:var(--text3);font-size:.75rem;text-decoration:none}
.nav-div::before,.nav-div::after{content:"";flex:1 1 auto;height:1px;background:var(--line)}
.nav-div span{display:inline-flex;align-items:center;gap:6px}
.from-chat{display:flex;flex-direction:column;gap:16px}
.from-chat-body{display:flex;flex-direction:column;gap:20px}
.main>.answer-bar{padding:0 clamp(16px,2.2vw,32px)}
.tab.answer{gap:8px}
.tab.answer a{color:inherit;text-decoration:none}
.tab.answer button{display:flex;align-items:center;justify-content:center;width:24px;height:24px;padding:0;border:0;border-radius:6px;background:none;color:inherit;cursor:pointer}
.draft{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 12px 10px 18px;border-radius:14px;border:1px solid var(--accent-line);background:var(--sel)}
.draft-text{flex:1 1 16rem;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.notice{display:flex;align-items:center;gap:12px;padding:12px clamp(16px,2.2vw,32px);border-bottom:1px solid var(--line);background:var(--okbg);color:var(--ok)}
.notice.bad{background:var(--badbg);color:var(--bad)}
.notice svg{flex:none}
.notice-text{flex:1 1 auto;min-width:0;font-weight:500;color:var(--text)}
.notice-close{flex:none;display:flex;padding:4px;border:0;border-radius:8px;background:transparent;color:inherit;cursor:pointer}
.notice-close:hover{background:var(--line)}
.publish .tool-spin{width:14px;height:14px;border-color:var(--ink);border-top-color:transparent}
.list-row .link{flex:none;white-space:nowrap}
.settings{display:flex;flex-direction:column}
.setting{display:grid;grid-template-columns:11rem minmax(0,1fr);align-items:center;gap:8px 20px;padding:1.25rem 0;border-top:1px solid var(--line)}
.setting:first-child{padding-top:0;border-top:0}
.setting:last-child{padding-bottom:0}
.setting-label{font-size:.9375rem;font-weight:600;color:var(--text)}
.setting-control{min-width:0;display:flex;align-items:center;gap:12px}
.setting-control .toggle{min-height:44px}
.ctl{flex:1 1 auto;min-height:44px;width:100%}
.ctl input,.ctl select{min-height:40px}
.ctl textarea{min-height:5rem}
@container (max-width:560px){.setting{grid-template-columns:1fr}}
.ctl-btn{width:36px;height:36px;flex:none;border:0;border-radius:9px;background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.req{margin-left:4px;color:var(--bad)}
.field-error{font-size:.8125rem;color:var(--bad)}
.ctl.bad{border-color:var(--bad)}
.ctl.off{opacity:.55}
.unit{flex:none;font-size:.8125rem;color:var(--text3)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;min-height:44px;box-sizing:border-box;padding:0 14px;border:1px solid var(--line2);border-radius:12px;background:var(--bg);color:var(--text2);font-size:.875rem;cursor:pointer}
.opt.on{border-color:var(--accent);background:var(--sel);color:var(--text)}
.opt.off{opacity:.55;cursor:default}
.opt:has(input:focus-visible){outline:1px solid var(--accent);outline-offset:2px}
.opt-dot{width:16px;height:16px;flex:none;box-sizing:border-box;border:2px solid var(--line2);border-radius:50%}
.opt.on .opt-dot{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--sel)}
.opt-box{width:16px;height:16px;flex:none;box-sizing:border-box;border:2px solid var(--line2);border-radius:5px}
.opt.on .opt-box{border-color:var(--accent);background:var(--accent)}
.applies{display:flex;align-items:center;gap:16px;width:100%}
.applies .toggle{flex:none;min-height:44px}
.form-tool{font-family:var(--mono);font-size:.75rem;color:var(--text3)}
.form-foot{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.pick-wrap{display:flex;flex-direction:column;gap:6px}
.ctl.open{border-color:var(--accent)}
.ctl.ph select{color:var(--text3)}
.pick{box-sizing:border-box;padding:6px;border-radius:12px;background:var(--card);border:1px solid var(--line2);display:flex;flex-direction:column;gap:2px}
.pick-item{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;padding:0 10px;border-radius:8px;font-size:.9375rem;color:var(--text2)}
.pick-item.on{background:var(--sel);color:var(--text)}
.pick-text{display:flex;flex-direction:column;gap:2px}
.pick-note{font-size:.8125rem;color:var(--text3)}
.pick-head{padding:8px 10px 2px;font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.pick-rule{height:1px;margin:4px 0;background:var(--line)}
.theme-picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(7rem,1fr));gap:10px;width:100%}
.theme-card{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0;box-sizing:border-box;padding:10px 12px;border-radius:12px;background:var(--card);border:1.5px solid var(--line2);color:var(--text);font-size:.875rem;cursor:pointer}
.theme-card.on{background:var(--sel);border-color:var(--accent)}
.theme-card:has(input:focus-visible){outline:1px solid var(--accent);outline-offset:2px}
.theme-dots{display:flex;gap:6px}
.theme-dots i{width:14px;height:14px;border-radius:50%;border:1px solid var(--line2)}
.theme-check{position:absolute;top:10px;right:10px;color:var(--accent)}
.ix-lead{max-width:62ch;font-size:.9375rem;line-height:1.6;color:var(--text2)}
.ix-tree{margin:0;padding:0;list-style:none;column-width:17rem;column-gap:32px;font-size:.875rem}
.ix-tree ul{margin:2px 0 0;padding:0 0 0 14px;list-style:none;border-left:1px solid var(--line)}
.ix-tree li{padding:3px 0}
.ix-sec{break-inside:avoid;padding-bottom:14px}
.ix-sec>.eyebrow{padding:0 0 4px}
.ix-route{font-family:var(--mono);font-size:.75rem;color:var(--text3)}
.ix-tree .ix-route{margin-left:8px}
.ix-tree .tag{margin-left:6px}
.ix-lead code{font-family:var(--mono);font-size:.8125rem;color:var(--text)}
.ix-planned{color:var(--text3)}
.ix-head{display:flex;align-items:center;gap:12px}
.ix-title{display:flex;flex-direction:column;gap:2px;min-width:0}
.ix-serves{display:flex;flex-wrap:wrap;gap:6px}
.ix-serves .tag{white-space:normal}
.seg{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:12px;background:var(--bg);border:1px solid var(--line2)}
.seg-label{font-size:.8125rem;color:var(--text3)}
.seg-item{display:inline-flex;align-items:center;min-height:32px;padding:0 14px;border:0;border-radius:9px;background:transparent;color:var(--text2);font-size:.8125rem;font-weight:500;text-decoration:none;cursor:pointer}
.seg-item[aria-current],.seg-item[aria-pressed=true]{background:var(--sel);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-line)}
.chart{display:flex;flex-direction:column;gap:14px;min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart-legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;padding:0;list-style:none;font-size:.8125rem;color:var(--text2)}
.chart-legend li{display:inline-flex;align-items:center;gap:6px}
.chart-legend .count{color:var(--text3)}
.swatch{width:10px;height:10px;flex:none;border-radius:3px;background:var(--c)}
.swatch.part{background:color-mix(in srgb,var(--accent) 45%,var(--card))}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-base{stroke:var(--line2);stroke-width:1}
.ch-tick,.ch-axis{fill:var(--text3);font-size:.6875rem}
.ch-peak{fill:var(--text);font-size:.6875rem;font-weight:600}
.ch-seg{stroke:var(--card);stroke-width:1.5}
.ch-total{fill:var(--text);font-family:var(--display);font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.ch-sub{fill:var(--text3);font-size:.75rem}
.ch-slice{fill:none;stroke:var(--c)}
.donut{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.donut svg{flex:none;width:11rem}
.donut-list{flex:1 1 9rem;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:.8125rem}
.donut-list li{display:flex;align-items:center;gap:8px;color:var(--text)}
.donut-list .count{margin-left:auto}
.rank{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px}
.rank-row{display:flex;flex-direction:column;gap:6px;border-radius:8px;color:var(--text);text-decoration:none}
a.rank-row:hover .rank-name{color:var(--accent);text-decoration:underline}
.rank-line{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:.875rem}
.rank-name{font-weight:600}
.rank-track{display:flex;gap:2px;height:12px}
.rank-in,.rank-out{height:100%;background:var(--accent);min-width:2px}
.rank-in{border-radius:3px 0 0 3px}
.rank-out{border-radius:0 3px 3px 0;background:color-mix(in srgb,var(--accent) 45%,var(--card))}
.heat{width:100%;border-collapse:separate;border-spacing:3px;font-size:.8125rem}
.heat th{padding:6px 8px;font-weight:500;color:var(--text2);text-align:left}
.heat thead th,.heat tbody th{white-space:nowrap}
.heat thead th{font-size:.75rem}
.heat thead .swatch{display:inline-block;margin-right:6px}
.heat td{height:2.5rem;padding:0 6px;border-radius:6px;text-align:center;font-family:var(--mono);color:var(--text)}
.heat .h0{color:var(--text4);box-shadow:inset 0 0 0 1px var(--line)}
.heat .h1{background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.heat .h2{background:color-mix(in srgb,var(--accent) 28%,var(--card))}
.heat .h3{background:color-mix(in srgb,var(--accent) 44%,var(--card))}
.heat .h4{background:color-mix(in srgb,var(--accent) 66%,var(--card));color:var(--ink)}
.heat .h5{background:var(--accent);color:var(--ink)}
.heat-key{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--text3)}
.heat-key i{width:1.25rem;height:.75rem;border-radius:3px;background:color-mix(in srgb,var(--accent) var(--p),var(--card))}
.apv-act{display:flex;flex-direction:column;gap:8px}
.apv-t td{padding-top:.75rem;padding-bottom:.75rem}
.cmp-sheet{box-sizing:border-box;max-width:1440px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:32px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.cmp-item{display:flex;flex-direction:column;gap:10px;min-width:0}
.cmp-name{font-family:var(--mono);font-size:.75rem;color:var(--text3)}
.cmp-row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.cmp-col{flex:none;width:22rem;display:flex;flex-direction:column;gap:12px}
.cmp-wide{flex:none;width:34rem;display:flex;flex-direction:column;gap:12px}
.cmp-tall{min-height:25rem}
.cmp-frame{border:1px solid var(--line);border-radius:12px;overflow:visible}
.cmp-bar{max-width:48rem}
.cmp-item .cmp-sheet{margin:0}
.cmp-schema{margin:0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text2);font-family:var(--mono);font-size:.75rem;overflow:auto;white-space:pre}
.cmp-anatomy :is(.strip,.side,.main,.chat){position:relative;outline:2px dashed var(--accent);outline-offset:-2px}
.cmp-anatomy :is(.strip,.side,.main,.chat)::after{position:absolute;left:10px;bottom:8px;z-index:6;padding:3px 8px;border-radius:6px;background:var(--accent);color:var(--ink);font-family:var(--mono);font-size:.6875rem}
.cmp-anatomy .strip::after{content:"Header strip: header_strip()";left:50%;bottom:-12px;transform:translateX(-50%)}
.cmp-anatomy .side::after{content:"Menu: menu()"}
.cmp-anatomy .main::after{content:"Content area: title_row() and the page content"}
.cmp-anatomy .chat::after{content:"Chat column: chat_column()"}
