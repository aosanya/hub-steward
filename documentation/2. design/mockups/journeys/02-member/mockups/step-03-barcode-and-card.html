<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Member step 3</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #EDF0EC;
  --surface: #FBFCFA;
  --ink: #1B2430;
  --ink-soft: #3D4652;
  --line: rgba(27, 36, 48, 0.16);
  --line-strong: rgba(27, 36, 48, 0.4);
  --accent: #703C0F;
  --on-accent: #FFFCF9;
  --display: "Arial Narrow", "Helvetica Neue", sans-serif;
  --sans: ui-sans-serif, system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161C;
    --surface: #1B222B;
    --ink: #E7E9E4;
    --ink-soft: #A7B0B8;
    --line: rgba(231, 233, 228, 0.16);
    --line-strong: rgba(231, 233, 228, 0.36);
    --accent: #DD9350;
    --on-accent: #1B140C;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.45;
}
h2.state {
  margin: 0 auto;
  padding: 24px 16px 0;
  max-width: 420px;
  font: 600 12px/1 var(--mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
h2.state.wide { max-width: 960px; }
.screen {
  max-width: 420px;
  min-height: 560px;
  margin: 12px auto 32px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  background: var(--bg);
  border: 1px solid var(--line);
}
.kiosk {
  max-width: 960px;
  min-height: 480px;
  margin: 12px auto 32px;
  padding: 56px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  align-items: center;
  gap: 48px;
  background: var(--surface);
  border: 1px solid var(--line);
}
.kiosk h1 {
  margin: 0 0 12px;
  font: 800 clamp(30px, 5vw, 52px)/1.05 var(--display);
  overflow-wrap: anywhere;
}
.kiosk p {
  margin: 0;
  font-size: clamp(16px, 2.2vw, 22px);
  line-height: 1.35;
  color: var(--ink-soft);
}
.card {
  width: 100%;
  max-width: 360px;
  aspect-ratio: 1.586;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  background: var(--accent);
  color: var(--on-accent);
}
.card .body {
  flex: 1;
  min-height: 0;
  padding: 16px 18px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.card .name {
  font: 800 26px/1.1 var(--display);
  overflow-wrap: anywhere;
}
.card .kind {
  font: 500 11px/1.2 var(--mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.card .code {
  margin-top: auto;
  font: 600 16px/1 var(--mono);
  letter-spacing: 0.14em;
}
.card .strip {
  height: 30%;
  background: #FFFFFF;
}
.line {
  margin: 0;
  font-size: 18px;
  font-weight: 500;
  text-align: center;
}
@media (max-width: 720px) {
  .kiosk {
    min-height: 0;
    padding: 32px 16px;
    grid-template-columns: minmax(0, 1fr);
    gap: 32px;
    border-left: 0;
    border-right: 0;
  }
  .screen { border-left: 0; border-right: 0; }
}
</style>
</head>
<body>
<h2 class="state wide">Terminal</h2>
<section class="kiosk" id="terminal">
  <div>
    <h1>Welcome, Akinyi Otieno.</h1>
    <p>You are connected to Siaya Community Computer Lab.</p>
  </div>
  <div class="card">
    <div class="body">
      <span class="name">Akinyi Otieno</span>
      <span class="kind">Hub member</span>
      <span class="code">SLH-0042</span>
    </div>
    <div class="strip"></div>
  </div>
</section>

<h2 class="state">Phone</h2>
<section class="screen" id="phone">
  <div class="card">
    <div class="body">
      <span class="name">Akinyi Otieno</span>
      <span class="kind">Hub member</span>
      <span class="code">SLH-0042</span>
    </div>
    <div class="strip"></div>
  </div>
  <p class="line">Show this at the desk</p>
</section>
</body>
</html>
