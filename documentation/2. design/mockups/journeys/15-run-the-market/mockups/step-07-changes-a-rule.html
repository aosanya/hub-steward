<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Changes a rule</title>
<style>
:root{font-size:112.5%;--mono:'JetBrains Mono',ui-monospace,monospace;--display:'Bricolage Grotesque',system-ui,sans-serif}
:root,[data-theme="dark"]{--bg:#0F0E0C;--side:#141210;--card:#1A1815;--chip:#26221D;--sel:#241F18;--line:#2A2621;--line2:#3A342C;--text:#F2EEE6;--text2:#C9C1B3;--text3:#A39C8F;--text4:#7D766B;--accent:#E8A33D;--accent-line:rgba(232,163,61,.4);--ink:#1A1306;--ok:#7FD6A8;--okbg:#1F3329;--bad:#FFB1A5;--badbg:#3A2420;--link:#F0B860;--link-hover:#FFD9A0;--shadow:rgba(0,0,0,.5)}
[data-theme="light"]{--bg:#F6F2EA;--side:#EFE9DD;--card:#FFFFFF;--chip:#ECE5D8;--sel:#F3ECDD;--line:#E2DACB;--line2:#CDC1AB;--text:#1F1B14;--text2:#463E31;--text3:#625948;--text4:#7A705F;--accent:#9F4D06;--accent-line:rgba(159,77,6,.45);--ink:#FFFFFF;--ok:#17613F;--okbg:#DDF1E5;--bad:#9E2416;--badbg:#FBE3DE;--link:#8F4308;--link-hover:#5E2A03;--shadow:rgba(60,40,10,.18)}
[data-theme="midnight"]{--bg:#0A0F1C;--side:#0D1424;--card:#121A2E;--chip:#1B2540;--sel:#17213A;--line:#1F2A44;--line2:#30406A;--text:#E8EEFA;--text2:#B9C5DD;--text3:#8FA0C0;--text4:#6C7C9E;--accent:#5CB8F5;--accent-line:rgba(92,184,245,.45);--ink:#04121F;--ok:#7FD6A8;--okbg:#14302A;--bad:#FFB1A5;--badbg:#3A1F2A;--link:#7CC8F8;--link-hover:#B5E0FC;--shadow:rgba(0,0,0,.55)}
[data-theme="forest"]{--bg:#08110C;--side:#0C1710;--card:#101E16;--chip:#1A2B20;--sel:#162619;--line:#1E3125;--line2:#2F4A3A;--text:#E6F0E8;--text2:#B7C9BC;--text3:#8CA394;--text4:#6B8274;--accent:#8FD19E;--accent-line:rgba(143,209,158,.45);--ink:#07140B;--ok:#8FD19E;--okbg:#1A3A28;--bad:#FFB1A5;--badbg:#3A2420;--link:#9BDDAA;--link-hover:#C6EED0;--shadow:rgba(0,0,0,.55)}
[data-theme="contrast"]{--bg:#000000;--side:#000000;--card:#0A0A0A;--chip:#1C1C1C;--sel:#141414;--line:#8C8C8C;--line2:#E6E6E6;--text:#FFFFFF;--text2:#F2F2F2;--text3:#D9D9D9;--text4:#B3B3B3;--accent:#FFE600;--accent-line:rgba(255,230,0,.6);--ink:#000000;--ok:#5CFF9D;--okbg:#00331A;--bad:#FF8A80;--badbg:#3D0A06;--link:#FFF176;--link-hover:#FFFFFF;--shadow:rgba(0,0,0,.8)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:1rem}
a{color:var(--link)}
a:hover{color:var(--link-hover)}
button,input,select,textarea{font:inherit}
input::placeholder,textarea::placeholder{color:var(--text4)}
select option{background:var(--card);color:var(--text)}
h1,h2,h3,p{margin:0}
h1,h2,h3,.brand{font-family:var(--display)}
h2{font-size:1.125rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
figure{margin:0 0 40px}
.jnav,.index-bar{position:sticky;top:0;z-index:10;display:flex;flex-direction:column;gap:4px;padding:8px clamp(16px,2.2vw,32px);background:var(--chip);border-bottom:1px solid var(--line2);font-size:.8125rem}
.jrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px}
.jlist,.jsteps{display:flex;flex-wrap:wrap;gap:4px;margin:0;padding:0;list-style:none}
.jnav a,.index-bar a{display:inline-flex;align-items:center;gap:6px;min-height:2rem;padding:0 12px;border-radius:999px;color:var(--text3);text-decoration:none}
.jnav a:hover,.index-bar a:hover{color:var(--text)}
.jnav a[aria-current]{background:var(--sel);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-line)}
.jnext{margin-left:auto}
.cap{padding:24px 16px 10px;font-family:var(--mono);font-size:.75rem;color:var(--text3)}
.cap-mcp,.cap-note{display:block;margin-top:4px;color:var(--text4)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
.control:has(:focus-visible),.search:has(:focus-visible),.composer:has(:focus-visible),.lang:has(:focus-visible),.toggle:has(:focus-visible) .track{outline:1px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{font-size:.8125rem;color:var(--text3)}
.soft{color:var(--text2)}
.count{font-family:var(--mono);font-size:.8125rem;color:var(--text3)}
.eyebrow{padding:0 10px 6px;font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.app{box-sizing:border-box;min-height:1060px;max-width:1440px;margin:0 auto;display:flex;flex-direction:column;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.cols{flex:1 1 auto;display:flex;flex-wrap:wrap;align-items:stretch}
.side{flex:1 1 260px;max-width:100%;box-sizing:border-box;padding:24px 16px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px}
.brand-row{display:flex;flex:none;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.brand{font-weight:700;font-size:1.1875rem;letter-spacing:-.01em;white-space:nowrap}
.demo{padding:3px 8px;border-radius:999px;border:1px solid var(--line2);font-size:.6875rem;color:var(--text2)}
.switch{position:relative;flex:none}
.drop{position:absolute;top:calc(100% + 8px);left:0;width:22rem;max-width:90vw;z-index:5;box-sizing:border-box;padding:8px;border-radius:14px;background:var(--card);border:1px solid var(--line2);box-shadow:0 12px 32px var(--shadow);display:flex;flex-direction:column;gap:12px}
.drop .search{background:var(--bg)}
.drop .hub{padding:6px 8px}
.hubs{display:flex;flex-direction:column;gap:4px}
.hub{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;box-sizing:border-box;padding:6px 10px;border:0;border-radius:10px;text-align:left;cursor:pointer;text-decoration:none;font-size:.875rem;font-weight:500;color:var(--text);background:var(--sel);box-shadow:inset 0 0 0 1px var(--line2)}
.hub svg{flex:none}
.chev{color:var(--text3)}
.tick{color:var(--accent)}
.hub-text{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.hub.compact{flex:none;width:auto;min-height:40px;padding:4px 10px}
.hub.compact .hub-text{flex:none;flex-direction:row;align-items:center;gap:10px}
.hub.compact .hub-name{white-space:nowrap}
.hub-name{overflow-wrap:anywhere}
.hub.other{background:transparent;box-shadow:none}
.hub-go{display:inline-flex;align-items:center;gap:4px;font-size:.8125rem;color:var(--link)}
.hub-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.75rem;color:var(--text3)}
.hub-meta .tag{padding:1px 6px}
.dot{width:8px;height:8px;flex:none;border-radius:50%;background:var(--accent)}
.dot.ok{background:var(--ok)}
.menu{display:flex;flex-direction:column;gap:14px}
.menu-group{display:flex;flex-direction:column;gap:2px}
.menu-rule{height:1px;margin:8px 0;background:var(--line)}
.menu-group.divided{padding-top:14px;border-top:1px solid var(--line)}
.nav-link{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:10px;color:var(--text2);text-decoration:none;font-size:.875rem}
.nav-link[aria-current]{color:var(--accent)}
.nav-icon{width:30px;height:30px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center}
.nav-icon.new{border:1px dashed var(--line2)}
.nav-icon.page{background:var(--chip)}
.nav-end{margin-left:auto;display:flex;align-items:center;gap:8px}
.nav-chev{display:flex;color:var(--text3)}
.sub{padding-left:30px}
.sub .nav-icon{width:24px;height:24px;border-radius:7px}
.nav-badge{min-width:20px;box-sizing:border-box;padding:1px 6px;border-radius:999px;background:var(--accent);color:var(--ink);font-size:.6875rem;font-weight:600;text-align:center}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.main{flex:999 1 560px;min-width:0;box-sizing:border-box;display:flex;flex-direction:column;container-type:inline-size}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:20px clamp(16px,2.2vw,32px);border-bottom:1px solid var(--line)}
.strip{position:relative;z-index:3;display:flex;align-items:center;gap:16px;box-sizing:border-box;min-height:3.5rem;padding:0 clamp(16px,2.2vw,32px);background:var(--chip);border-bottom:1px solid var(--line2)}
.top-end{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.strip-end{display:flex;flex:none;align-items:center;margin-left:auto}
.strip-div{width:1px;height:24px;flex:none;background:var(--line2)}
.crumb{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:.8125rem;color:var(--text3)}
.crumb a{color:inherit;text-decoration:none}
.crumb a:hover{color:var(--text)}
.crumb-now{font-weight:500;color:var(--text)}
@media (max-width:60rem){.hub.compact .tag{display:none}.strip{flex-wrap:wrap;gap:6px 16px;padding-top:8px;padding-bottom:8px}.strip-end{order:2}.strip .crumb{order:3;flex:1 1 100%}.strip-div{display:none}}
h1{font-weight:700;font-size:clamp(1.5rem,2.6vw,2rem);letter-spacing:-.02em}
.lang{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text2);font-size:.875rem;font-weight:500}
.lang select{padding-right:10px;border:0;background:transparent;color:var(--text);outline:none;cursor:pointer}
.content{flex:1 1 auto;padding:28px clamp(16px,2.2vw,32px) 40px;display:flex;flex-direction:column;gap:24px}
.bare-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px clamp(16px,3vw,40px)}
.bare-body{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px 16px}
.stack{--stack-gap:16px;display:flex;flex-direction:column;gap:var(--stack-gap)}
.row{--row-gap:12px;display:flex;flex-wrap:wrap;align-items:center;gap:var(--row-gap)}
.grid{--grid-min:16rem;--grid-gap:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--grid-min)),1fr));gap:var(--grid-gap)}
.two-col{--cols:2fr 1fr;display:grid;grid-template-columns:var(--cols);gap:20px;align-items:start}
.two-col>*{min-width:0}
@container (max-width:700px){.two-col{grid-template-columns:1fr}}
.section-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
.panel,.card{box-sizing:border-box;min-width:0;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column}
.panel{border-radius:18px}
.card{padding:24px;gap:18px;border-radius:14px}
.card.tight{padding:16px;gap:12px}
.q-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rule-head{display:flex;align-items:center;gap:12px}
.rule-head .ctl{width:8rem}
.rule{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr) minmax(0,2fr) auto;gap:8px;align-items:center}
.rule-end{display:flex;gap:8px}
.rule .btn{padding:0 12px}
.step{padding:0;gap:0}
.step>summary{display:flex;align-items:center;gap:12px;padding:16px 24px;cursor:pointer;list-style:none}
.step>summary::-webkit-details-marker{display:none}
.step[open]>summary{border-bottom:1px solid var(--line)}
.step[open]>summary .chev{transform:rotate(180deg)}
.step-sum{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-left:auto;min-width:0}
.step-body{padding:24px;display:flex;flex-direction:column}
.card-head{display:flex;align-items:center;gap:12px}
.card-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.tile{display:flex;gap:12px;align-items:center;padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none}
.tile.warn{border-color:var(--accent)}
.tile.bad{border-color:var(--bad)}
.tile-arrow{margin-left:auto;flex:none;color:var(--text3)}
.tile.warn .tile-arrow{color:var(--accent)}
.tile-badge{width:28px;height:28px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--okbg);color:var(--ok)}
.tile.warn .tile-badge{background:var(--accent);color:var(--ink)}
.tile.bad .tile-badge{background:var(--badbg);color:var(--bad)}
.tile.mute .tile-badge{background:var(--chip);color:var(--text3)}
.tile-text{display:flex;flex-direction:column;gap:3px;min-width:0}
.tile-label{font-size:.8125rem;color:var(--text3)}
.tile-value{font-weight:600;font-size:.9375rem}
.stat{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.stat-label{font-size:.8125rem;color:var(--text3)}
.stat-value{font-family:var(--display);font-size:1.75rem;font-weight:700;letter-spacing:-.02em}
.stat-sub{font-size:.8125rem;color:var(--text3)}
.progress{display:flex;align-items:center;gap:12px}
.bar{flex:1 1 auto;height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:3px}
.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:12px 16px;font-size:.875rem}
.kv dt{color:var(--text3)}
.kv dd{margin:0;text-align:right}
.divider{margin:0;border:0;border-top:1px solid var(--line)}
.note{padding:14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:.8125rem;line-height:1.55;color:var(--text2)}
.glyph{flex:none;width:40px;height:40px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.badge{width:30px;height:30px;flex:none;border-radius:8px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600}
.badge.avatar{border-radius:50%}
.badge.accent{background:var(--accent);color:var(--ink)}
.badge.chat-mark{color:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:var(--chip);font-size:.6875rem;color:var(--text2);white-space:nowrap}
.tag.use,.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.warn{background:var(--sel);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tag.bad{background:var(--badbg);color:var(--bad)}
.tag.mute{background:transparent;color:var(--text3);box-shadow:inset 0 0 0 1px var(--line2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;box-sizing:border-box;padding:0 22px;border:1px solid transparent;border-radius:12px;font-size:.9375rem;font-weight:600;text-decoration:none;cursor:pointer}
.btn.sm{min-height:40px;padding:0 18px}
.btn.xs{min-height:32px;padding:0 12px;font-size:.8125rem}
.btn.act{width:100%}
.btn.primary{background:var(--accent);color:var(--ink)}
.btn.quiet{background:transparent;border-color:var(--line2);color:var(--text)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:disabled{background:transparent;border-color:var(--line);color:var(--text4);cursor:default}
.btn.primary:disabled{background:var(--line2);border-color:transparent;color:var(--text3)}
.link{display:inline-flex;align-items:center;gap:6px;color:var(--accent);text-decoration:none}
.link:hover{text-decoration:underline}
.link.sm{font-size:.8125rem}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field-label{font-size:.8125rem;font-weight:600;color:var(--text2)}
.field-value{font-size:.9375rem}
.hint{display:flex;align-items:center;gap:8px;font-size:.8125rem;color:var(--text3)}
.control{display:flex;align-items:center;gap:8px;min-height:52px;box-sizing:border-box;padding:0 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line2);font-size:.9375rem}
.control svg{flex:none;color:var(--text3)}
.control input,.control select,.control textarea{flex:1 1 auto;min-width:0;border:0;background:transparent;color:var(--text);outline:none}
.control input{min-height:44px}
.control select{appearance:none;min-height:44px;cursor:pointer}
.control textarea{min-height:4.5rem;padding:10px 0;resize:none}
.search{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--text3);font-size:.875rem}
.search input{flex:1 1 auto;min-width:0;border:0;background:transparent;color:var(--text);outline:none}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.toolbar-group{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.toolbar-group:first-child{flex:1 1 auto}
.toolbar .search{flex:0 1 280px}
.filter{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 6px 0 12px;border-radius:999px;background:var(--sel);box-shadow:inset 0 0 0 1px var(--line2);font-size:.8125rem}
.filter button{width:24px;height:24px;border:0;border-radius:50%;background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.tabs{display:flex;flex-wrap:wrap;gap:24px;border-bottom:1px solid var(--line)}
.tab{display:flex;align-items:center;min-height:44px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--text2);text-decoration:none;font-size:.875rem;font-weight:500}
.tab[aria-current]{color:var(--accent);border-bottom-color:var(--accent)}
.table-card{overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:.875rem}
.table th{padding:14px 12px;white-space:nowrap;border-bottom:1px solid var(--line);font-size:.6875rem;font-weight:400;letter-spacing:.08em;text-align:left;text-transform:uppercase;color:var(--text3)}
.table td{height:40px;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table td.row-act,.table th.row-act{position:sticky;right:0;width:1%;background:var(--card);text-align:right;white-space:nowrap}
.cell{display:flex;align-items:center;gap:12px}
.cell-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.cell-name{font-size:.9375rem;font-weight:600}
a.cell-name{color:var(--text);text-decoration:none}
a.cell-name:hover{color:var(--accent);text-decoration:underline}
.cell-sub{font-size:.8125rem;color:var(--text3)}
.empty{display:flex;flex-direction:column;align-items:center;gap:14px;padding:32px 24px;border:1px dashed var(--line2);border-radius:14px;background:var(--card);text-align:center;color:var(--text2);font-size:.9375rem}
.panel .empty{border:0;background:transparent}
.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:160px;padding:16px;box-sizing:border-box;border:1.5px dashed var(--line2);border-radius:14px;color:var(--text2);text-decoration:none;font-size:.875rem;text-align:center}
.add-note{font-size:.8125rem;color:var(--text3)}
.toggle{display:flex;align-items:center;gap:12px;font-size:.875rem;color:var(--text2);cursor:pointer}
.track{position:relative;width:40px;height:24px;flex:none;border-radius:999px;background:var(--line2)}
.track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--text)}
input:checked+.track{background:var(--accent)}
input:checked+.track::after{left:19px;background:var(--ink)}
input:disabled+.track{opacity:.45}
.toggle:has(input:disabled){cursor:default}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl-item{position:relative;display:flex;gap:14px;padding-bottom:20px}
.tl-item:last-child{padding-bottom:0}
.tl-item:not(:last-child)::before{content:"";position:absolute;left:9px;top:22px;bottom:2px;width:2px;background:var(--line)}
.tl-dot{width:20px;height:20px;flex:none;box-sizing:border-box;border-radius:50%;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.tl-item.done .tl-dot{background:var(--ok);border-color:var(--ok)}
.tl-item.now .tl-dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--sel)}

<h1>Group order</h1>
<div class="top-end"><a class="btn primary" href="#" title="Opens: Edit a workflow, steps" aria-label="Add a step, opens: Edit a workflow, steps">Add a step</a></div>
</div>

<div class="content">

<div class="stack" style="--stack-gap:20px"><section class="card" aria-label="Workflow">
<div class="card-head"><h2>Workflow</h2><div class="card-actions"><span class="tag mute">Proposed: version and call off</span></div></div>
<dl class="kv"><dt>Version</dt><dd>2</dd><dt>Objectives</dt><dd><div class="stack" style="--stack-gap:4px"><a class="link" href="#" title="Opens: Objectives" aria-label="O-3, opens: Objectives">O-3</a> <span class="muted">Farmers buy together in a group order</span></div></dd><dt>Orders under way</dt><dd><a class="link" href="#" title="Opens: Group order, open" aria-label="1, started on version 1, finishes on version 1, opens: Group order, open">1, started on version 1, finishes on version 1</a></dd><dt>Records</dt><dd>Payments</dd><dt>A Farmer can change or cancel their share</dt><dd>Until the Group coordinator sends the order</dd><dt>Can be called off</dt><dd>By the Group coordinator, at any step</dd></dl>
</section><div class="section-head"><h2>Steps</h2><span class="tag mute">Proposed: kind, actor and form</span></div><div class="stack" style="--stack-gap:12px"><section class="card" aria-label="1 · Start">
<div class="card-head"><h2>1 · Start</h2></div>
<dl class="kv"><dt>Description</dt><dd>The Group coordinator starts a group order under one group of Farmers: its members can see it and join. The Supplier, the bulk price and the minimum are set here.</dd><dt>Kind</dt><dd>Fill a form</dd><dt>Actor</dt><dd>Group coordinator</dd><dt>Action</dt><dd>Fills the Group order form</dd><dt>Tool</dt><dd><span class="tag mute">market_start_group_order</span></dd><dt>Questions</dt><dd>Select the target group (from Siaya farmers), Select the supplier (from Supplier), Enter the bulk price per bag, Enter the minimum total of bags</dd></dl>
</section><section class="card" aria-label="2 · Send the invitation">
<div class="card-head"><h2>2 · Send the invitation</h2></div>
<dl class="kv"><dt>Description</dt><dd>The agency sends every member of the group a form asking whether they want to join the order.</dd><dt>Kind</dt><dd>Send form</dd><dt>Actor</dt><dd>The agency</dd><dt>Action</dt><dd>Sends the invitation to the Farmer</dd><dt>Sends to</dt><dd>Farmer</dd><dt>Questions</dt><dd>Do you want to join this order?</dd></dl>
</section><section class="card" aria-label="3 · Answer the invitation">
<div class="card-head"><h2>3 · Answer the invitation</h2></div>
<dl class="kv"><dt>Description</dt><dd>Each member of the group who got the invitation answers it.</dd><dt>Kind</dt><dd>Say yes or no</dd><dt>Actor</dt><dd>Farmer</dd><dt>Action</dt><dd>Answers the invitation</dd><dt>Answers the form sent in</dt><dd>Send the invitation</dd><dt>Questions</dt><dd>Do you want to join this order?</dd></dl>
</section><section class="card" aria-label="4 · Sort the answers">
<div class="card-head"><h2>4 · Sort the answers</h2></div>
<dl class="kv"><dt>Description</dt><dd>The agency reads each answer to the invitation: a yes goes on to Open, and anything else gets a thank-you at once.</dd><dt>Kind</dt><dd>Route</dd><dt>Actor</dt><dd>The agency</dd><dt>Action</dt><dd>Routes the answers of Send the invitation</dd><dt>Answers the form sent in</dt><dd>Send the invitation</dd><dt>Routes</dt><dd>Match all: Do you want to join this order? is Yes, then open</dd><dt>Otherwise</dt><dd>Thank you</dd></dl>
</section><section class="card" aria-label="5 · Open">
<div class="card-head"><h2>5 · Open</h2></div>
<dl class="kv"><dt>Description</dt><dd>Each member who said yes joins with an amount; a silent line waits for the Group coordinator's decision.</dd><dt>Kind</dt><dd>Fill a form</dd><dt>Actor</dt><dd>Farmer</dd><dt>Action</dt><dd>Fills the Join form</dd><dt>Tool</dt><dd><span class="tag mute">market_join_group_order</span></dd><dt>Questions</dt><dd>Enter the number of bags</dd></dl>
</section><section class="card" aria-label="6 · Send">
<div class="card-head"><h2>6 · Send</h2></div>
<dl class="kv"><dt>Description</dt><dd>The Group coordinator sends the order once the total reaches the minimum.</dd><dt>Kind</dt><dd>Notify</dd><dt>Actor</dt><dd>Group coordinator</dd><dt>Action</dt><dd>Notifies the Supplier with the order and the order's details</dd><dt>Tool</dt><dd><span class="tag mute">market_send_group_order</span></dd><dt>Notifies</dt><dd>Supplier</dd><dt>Attaches</dt><dd>The order's details</dd><dt>Questions</dt><dd>Write the message</dd></dl>
</section><section class="card" aria-label="7 · Answered">
<div class="card-head"><h2>7 · Answered</h2></div>
<dl class="kv"><dt>Description</dt><dd>The Supplier says yes with a date, or no, or offers a smaller amount.</dd><dt>Kind</dt><dd>Say yes or no</dd><dt>Actor</dt><dd>Supplier</dd><dt>Action</dt><dd>Gives the supplier's answer</dd><dt>Tool</dt><dd><span class="tag mute">market_promise_group_order</span></dd><dt>Questions</dt><dd>Can you fill this order?, Enter the date you can deliver</dd><dt>Time limit</dt><dd>2,880 minutes, then Cancel runs</dd></dl>
</section><section class="card" aria-label="8 · Thank you">
<div class="card-head"><h2>8 · Thank you</h2></div>
<dl class="kv"><dt>Description</dt><dd>A Farmer who said no to joining is thanked at once, with a message written here once.</dd><dt>Kind</dt><dd>Notify</dd><dt>Actor</dt><dd>The agency</dd><dt>Action</dt><dd>Notifies the Farmer with the thank-you message</dd><dt>Notifies</dt><dd>Farmer</dd><dt>Attaches</dt><dd>Nothing</dd><dt>Questions</dt><dd>Message sent (always "Thank you for the response")</dd></dl>
</section></div></div>
